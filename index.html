forced → reinforces", "tag": "병렬구조 (동사 수일치·시제)", "lines": ["Furthermore, the high price (of these products) is often perceived (as a sign of quality) and [reinforced → reinforces] a customer's confidence (in the company).", "→ 전명구 묶으면 the high price(주어) + is perceived(동사1) and ____(동사2).", "→ and로 is perceived와 <b>병렬<\/b> → 주어 the high price(단수) + 일반적 사실(현재시제) → reinforces.", "→ 뒤에 목적어 a customer's confidence가 있으므로 능동. 가격이 신뢰를 '강화한다'!"], "ko": "게다가 이러한 제품의 높은 가격은 흔히 품질의 표시로 여겨지며, 회사에 대한 고객의 신뢰를 강화한다."}], "others": [["❶", "that", "means의 목적어 + 뒷문장 완전 → 접속사 that"], ["❷", "few", "셀 수 있는 복수명사 substitutes → few"], ["❸", "who", "선행사 사람 + 주어 없는 불완전한 문장 → who"], ["❹", "lowering", "전치사 in 뒤 → 동명사"]], "note": "※ and/or 병렬에서는 짝이 되는 앞 동사를 먼저 찾고 수·시제·태를 맞춘다. 분사(reinforcing)나 원형(reinforce)으로 바꿔 내기도 한다.", "summary": ""}}, {"no": 25, "src": "6월 31번", "stem": "<b>다음 글의 괄호 (A), (B), (C) 안에서 어법에 맞는 낱말로 가장 적절한 것은?<\/b>", "kind": "table", "sym": "①", "n": 5, "p": ["One easily underappreciated feature of a city street or square is its &quot;future-proof&quot; nature. The ancient medieval squares in places like Marrakesh and Siena <span class=\"br\"><span class=\"brl\">(A)<\/span>[is <i>/<\/i> are]<\/span> still places where stuff is sold every day, even if the stuff itself has changed over the last five hundred years. The city square is a fairly future-proof technology, as is the shopping street, even in an age of online shopping. For example, the same physical store <span class=\"br\"><span class=\"brl\">(B)<\/span>[that <i>/<\/i> where]<\/span> once sold buggy whips and typewriters might now repair damaged phones and sell bubble tea. The same infrastructure supports <span class=\"br\"><span class=\"brl\">(C)<\/span>[evolving <i>/<\/i> evolved]<\/span> uses. Jane Jacobs, the great prophet of the city economy, made much of this fact in her books, including The Death and Life of Great American Cities and The Nature of Economies. As she pointed out, the great advantage of a city architecture is its ability to support change in uses, and Jacobs correctly predicted the persistence of the city itself, unlike those who predicted the rise of the Internet would mean the death of the city. Urban spaces remain valuable because they can support different activities over time. Their strength lies not in remaining fixed but in being sufficiently flexible to accommodate change. This adaptability explains why city streets and squares have continued to survive despite dramatic shifts in economic activity."], "notes": [], "bogi": null, "ch": {"head": ["(A)", "(B)", "(C)"], "rows": [["is", "that", "evolving"], ["is", "where", "evolving"], ["are", "that", "evolved"], ["are", "where", "evolved"], ["are", "that", "evolving"]]}, "ans": [5], "ex": {"core": [{"key": "(A)", "fix": "are (O) / is (X)", "tag": "주어-동사 수일치", "lines": ["The ancient medieval squares (in places like Marrakesh and Siena) [is / are] still places (where stuff is sold every day), ~", "→ 전명구 묶고 없는 셈 치기! 남는 주어는 The ancient medieval squares(복수).", "→ 바로 앞 Siena에 속지 말 것 → 복수 동사 are"], "ko": "마라케시나 시에나 같은 곳의 오래된 중세 광장들은 여전히 매일 물건이 팔리는 장소이다."}, {"key": "(B)", "fix": "that (O) / where (X)", "tag": "관계대명사 vs 관계부사", "lines": ["For example, the same physical store [that / where] once sold buggy whips and typewriters might now repair damaged phones and sell bubble tea.", "→ 뒷문장 once sold(동사) + buggy whips and typewriters(목적어) → <b>주어가 없다<\/b> → 불완전한 문장.", "→ 뒷문장이 불완전하면 관계대명사, 완전하면 관계부사 → 주격 관계대명사 that"], "ko": "예를 들어, 한때 마차 채찍과 타자기를 팔던 바로 그 상점이 지금은 고장 난 휴대폰을 고치고 버블티를 팔고 있을지도 모른다."}, {"key": "(C)", "fix": "evolving (O) / evolved (X)", "tag": "현재분사 vs 과거분사", "lines": ["The same infrastructure supports [evolving / evolved] uses.", "→ 명사 uses를 앞에서 꾸미는 분사 자리.", "→ 용도가 시간이 지나며 스스로 '변화해 가는' 것 → 능동·진행의 현재분사 evolving", "앞 문장: 채찍·타자기 가게 → 휴대폰 수리·버블티 (용도가 계속 바뀜)"], "ko": "같은 기반 시설이 변화해 가는 용도들을 지원한다."}], "others": [], "note": "※ 수일치에서 지울 수식어: ① 쉼표-쉼표 삽입 ② 관계사절 ③ to부정사 부사적 용법 ④ 전명구 ⑤ 부사(절)", "summary": "→ are / that / evolving : ⑤"}}, {"no": 26, "src": "6월 32번", "stem": "<b>다음 글에서 밑줄 친 ①~⑤ 중 어법상 옳지 <u>않은 <\/u>것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["The genomics revolution made it possible <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>to see<\/u><\/span> just how impactful touch is to plants on a deeper level. Researchers peered at the genes of Arabidopsis thaliana, a weedy plant in the mustard family and the lab rat of the plant biology world. They found that touch caused <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>such<\/u><\/span> a dramatic response in the plant&#x27;s hormones and gene expression that it could substantially inhibit its growth. After <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>stroking<\/u><\/span> the arabidopsis with soft paintbrushes, the researchers analyzed the plants&#x27; genetic responses. Within thirty minutes of being touched, 10 percent of the plant&#x27;s genome <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>was altered<\/u><\/span>. Clearly, the plant was reorganizing its priorities to deal with the disturbance, and <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>reroute<\/u><\/span> energy away from the hard work of getting taller. Touched multiple times, arabidopsis cut its upward growth rate by as much as 30 percent."], "notes": [], "bogi": null, "ch": null, "ans": [5], "ex": {"core": [{"key": "❺", "fix": "reroute → rerouting", "tag": "병렬구조", "lines": ["Clearly, the plant was reorganizing its priorities (to deal with the disturbance), and [reroute → rerouting] energy (away from the hard work of getting taller).", "→ to부정사(부사적 용법)·전명구 묶으면 the plant(주어) + was reorganizing(동사1) and ____(동사2).", "→ and로 was reorganizing과 <b>병렬<\/b> → was가 생략된 (was) rerouting.", "→ 동사원형 reroute는 was 뒤에 올 수 없다.", "※ to deal과 병렬로 보아 (to) reroute로 읽을 수도 있지만, 쉼표 뒤 and는 주절의 was reorganizing과 이어진다 → 출제 의도는 (was) rerouting"], "ko": "분명히 그 식물은 방해에 대처하기 위해 우선순위를 재조정하고, 키를 키우는 힘든 일로부터 에너지를 다른 곳으로 돌리고 있었다."}], "others": [["❶", "to see", "가목적어 it → 진목적어 to부정사"], ["❷", "such", "such a + 형용사 + 명사 + that 구문"], ["❸", "stroking", "전치사 After 뒤 + 목적어 있음 → 동명사"], ["❹", "was altered", "percent of + 단수명사 genome, '변화된' → 수동"]], "note": "※ and 뒤에 be동사·조동사가 생략된 병렬은 내신 단골 → 짝이 되는 앞 동사의 형태부터 확인한다.", "summary": ""}}, {"no": 27, "src": "6월 34번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["The high price of land in metropolitan areas <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>has<\/u><\/span> implications for the efficient employment of resources. For example, in New York City, as in many large cities, sidewalk vending carts sell everything from hot dogs to ice cream. Why are these carts so <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>popularly<\/u><\/span>, with over 3,000 in New York City alone? Consider the resources used to <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>supply<\/u><\/span> hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>is<\/u><\/span> most expensive in New York City? Retail space along Madison Avenue rents for an average of $550 a year per square foot. Because operating a hot dog cart <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>requires<\/u><\/span> about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space."], "notes": [], "bogi": null, "ch": null, "ans": [2], "ex": {"core": [{"key": "❷", "fix": "popularly → popular", "tag": "형용사 vs 부사 (보어 자리)", "lines": ["Why are these carts so [popularly → popular], (with over 3,000 in New York City alone)?", "→ 전명구 묶으면 are(동사) + these carts(주어) + so ____(보어).", "→ be동사 뒤 주어의 상태를 설명하는 <b>보어 자리<\/b> → 부사 X, 형용사 O.", "→ 카트들이 '인기 있는' 상태 → popular"], "ko": "뉴욕시에만 3,000개가 넘게 있을 정도로, 이 카트들은 왜 그렇게 인기가 있을까?"}], "others": [["❶", "has", "of land ~ 묶으면 주어 The high price → 단수"], ["❸", "supply", "목적의 to부정사 to 뒤 → 동사원형"], ["❹", "is", "do you suppose는 삽입, 주어 Which → 단수"], ["❺", "requires", "동명사 주어 operating ~ → 단수 취급"]], "note": "※ be, become, seem, look, remain 뒤 보어 자리 → 형용사. 부사로 바꿔 내는 함정 주의!", "summary": ""}}, {"no": 28, "src": "6월 34번", "stem": "<b>다음 글의 밑줄 친 ⓐ~ⓔ 중 어법이 옳지 <u>않은<\/u> 것은?<\/b>", "kind": "mark", "sym": "ⓐ", "n": 5, "p": ["The high price of land in metropolitan areas <span class=\"opt\" data-k=\"1\"><span class=\"mk\">ⓐ<\/span><u>has<\/u><\/span> implications for the efficient employment of resources. For example, on the public sidewalks of New York City <span class=\"opt\" data-k=\"2\"><span class=\"mk\">ⓑ<\/span><u>stands<\/u><\/span> over 3,000 vending carts selling everything from hot dogs to ice cream. Consider the resources <span class=\"opt\" data-k=\"3\"><span class=\"mk\">ⓒ<\/span><u>used to<\/u><\/span> supply hot dogs: land, labor, capital, entrepreneurial ability, plus intermediate goods such as hot dogs, buns, and other ingredients. Which of these do you suppose is most expensive in New York City? Retail space along Madison Avenue <span class=\"opt\" data-k=\"4\"><span class=\"mk\">ⓓ<\/span><u>rents for<\/u><\/span> an average of $550 a year per square foot. Because <span class=\"opt\" data-k=\"5\"><span class=\"mk\">ⓔ<\/span><u>operating<\/u><\/span> a hot dog cart requires about 4 square yards, it could cost as much as $20,000 a year to rent that much commercial space. Aside from the necessary public permits, however, space on the public sidewalk is free to vendors. Profit-maximizing street vendors substitute public sidewalks for costly commercial space."], "notes": [], "bogi": null, "ch": null, "ans": [2], "ex": {"core": [{"key": "ⓑ", "fix": "stands → stand", "tag": "도치 구문 수일치", "lines": ["For example, (on the public sidewalks of New York City) [stands → stand] over 3,000 vending carts (selling everything from hot dogs to ice cream).", "→ 장소 부사구가 문장 앞으로 나가면서 <b>동사 + 주어<\/b> 어순으로 도치되었다.", "→ 진짜 주어는 동사 뒤의 over 3,000 vending carts(복수) → 복수 동사 stand", "Over 3,000 vending carts stand on the sidewalks. → On the sidewalks stand over 3,000 vending carts."], "ko": "예를 들어, 뉴욕시의 공공 인도에는 핫도그부터 아이스크림까지 모든 것을 파는 3,000개가 넘는 노점 카트가 서 있다."}], "others": [["ⓐ", "has", "of land ~ 묶으면 주어 The high price → 단수"], ["ⓒ", "used to", "과거분사 used + 목적의 to부정사 → 원형 supply"], ["ⓓ", "rents for", "주어 Retail space(단수) → rents"], ["ⓔ", "operating", "Because절의 동명사 주어 → requires와 호응"]], "note": "※ 장소 부사구·Here/There 도치 → 동사 뒤 명사가 진짜 주어. 바로 앞 명사(New York City)에 수를 맞추지 말 것.", "summary": ""}}, {"no": 29, "src": "6월 36번", "stem": "<b>다음 글의 밑줄 친 ①~⑤ 중, 어법상 옳지 <u>않은<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["For most animals the struggle to survive takes up all their time. Finding food and drink, keeping warm and clean, avoiding predators, migrating and reproducing consume all their energies. If they do have any time to spare, they spend it resting or sleeping. Only very young animals, under the protection of their parents <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>have<\/u><\/span> enough surplus energy to engage in lively bouts of play. This was also true for our early ancestors. Like other animals, they faced a constant struggle for food and safety. The constant search for food <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>would have put<\/u><\/span> heavy demands upon them. But as they slowly evolved into more and more efficient hunters, the situation <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>changing<\/u><\/span>. It takes intelligence rather than strength to survive successfully. The secret of their success was the development of much greater intelligence. They used brain not brawn to kill their prey. At the end of the long hunting era, before they <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>turned to<\/u><\/span> farming, they were already enjoying some degree of affluence. In certain regions, at particular times of year, the prey was sufficiently plentiful and their hunting techniques sufficiently <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>advanced<\/u><\/span> for them to experience a remarkable degree of prosperity. They had time on their hands."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "❸", "fix": "changing → changed", "tag": "동사 vs 준동사", "lines": ["But (as they slowly evolved into more and more efficient hunters), the situation [changing → changed].", "→ 부사절 묶고 없는 셈 치기! 남는 것은 the situation(주어)뿐 → 동사가 없다.", "→ -ing는 혼자서 동사가 될 수 없다 → 부사절과 시제를 맞춘 과거 동사 changed"], "ko": "하지만 그들이 점점 더 효율적인 사냥꾼으로 서서히 진화하면서, 상황은 바뀌었다."}], "others": [["❶", "have", "삽입구 묶으면 주어 young animals → 복수"], ["❷", "would have put", "과거 일에 대한 추측 → would have p.p."], ["❹", "turned to", "before절의 과거 동사, '~로 전환하다'"], ["❺", "advanced", "(were) 생략, 보어 자리 형용사 '발전된'"]], "note": "※ 긴 부사절 뒤에는 주절의 동사가 있는지 반드시 확인한다. 동사 자리를 -ing·to부정사로 바꿔 내는 문제가 자주 나온다.", "summary": ""}}, {"no": 30, "src": "6월 37번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Think about a time when you were startled. Did you come to a sudden stop, freeze all your movements, and hold your breath as you scanned the environment for a threat? All these responses maximize our ability to avoid detection, locate the source of possible danger, and prepare to fight or flee. As <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>elaborately<\/u><\/span> as language has become, it is still the creation of sound that might give away our location to a potential predator. Because of this, the freeze response results in the inhibition of language in <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>highly<\/u><\/span> stressful and traumatic situations. Natural selection promoted the evolution of language but <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>conserved<\/u><\/span> the freeze rule. When the threat passes, we begin to relax and find our voices again, perhaps even <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>to laugh<\/u><\/span> at our own reactions. But what if we can never relax? What if our experiences shape our brain <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>to be<\/u><\/span> in a constant state of fear? This interference with the proper development and integration of neural networks can result in chronic stress and even mental illness."], "notes": [], "bogi": null, "ch": null, "ans": [1], "ex": {"core": [{"key": "❶", "fix": "elaborately → elaborate", "tag": "형용사 vs 부사", "lines": ["As [elaborately → elaborate] as language has become, it is still the creation of sound ~", "→ <b>As + ___ + as + 주어 + 동사<\/b> = '아무리 ~해도' 양보 구문!", "→ 원래 어순으로 되돌리면 Though language has become ___ → become의 <b>보어 자리<\/b>", "→ 보어 자리에 부사 X → 형용사 <b>elaborate<\/b>"], "ko": "언어가 아무리 정교해졌다 해도, 잠재적인 포식자에게 우리의 위치를 드러낼 수 있는 것은 여전히 소리를 내는 일이다."}], "others": [["❷", "highly", "형용사 stressful 수식 → 부사 highly('매우')"], ["❸", "conserved", "but 앞 promoted와 병렬 → 과거동사"], ["❹", "to laugh", "begin의 목적어 to relax, (to) find와 병렬 → to부정사"], ["❺", "to be", "shape + 목적어 + to부정사 → 목적격보어"]], "note": "※ 앞자리가 보어 자리면 형용사, 동사 수식이면 부사 (Hard as he tried = Though he tried hard)<br>※ Though → As 어순 바꾸기 서술형 대비", "summary": ""}}, {"no": 31, "src": "6월 38번", "stem": "<b>다음 글의 밑줄 친 부분 중 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Due to concerns about the impact of violent video games on youth, much research has been <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>conducted<\/u><\/span> on video gaming with regard to empathy. Scientists have formulated credible explanations of how video gaming could affect empathy. When people witness violent events, a healthy reaction is to feel negative emotions and <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>experience<\/u><\/span> physiological arousal that is connected to fear or disgust. However, repeated exposure to violent events - such as when playing video games - <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>cause<\/u><\/span> this healthy reaction in youth to become blunted. That is, a phenomenon known as desensitization <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>occurs<\/u><\/span>. They will have diminished emotional responses to violence, which interferes with the ability to sympathize with others, <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>leading<\/u><\/span> to reduced empathy. A significant body of work shows an association between extensive violent video gaming and reduced empathy in people."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "❸", "fix": "cause → causes", "tag": "주어-동사 수일치", "lines": ["However, repeated exposure (to violent events) (- such as when playing video games -) [cause → causes] this healthy reaction in youth to become blunted.", "→ 전명구, 대시-대시 삽입 묶고 없는 셈 치기! 남는 주어는 <b>exposure(단수)<\/b>", "→ 단수 주어의 동사 → <b>causes<\/b>. 바로 앞 events, games(복수)에 속지 말 것"], "ko": "그러나 (비디오 게임을 할 때처럼) 폭력적인 사건에 반복적으로 노출되면 청소년의 이 건강한 반응이 무뎌지게 된다."}], "others": [["❶", "conducted", "연구가 '수행되는' 것 → 수동태 has been p.p."], ["❷", "experience", "to feel과 and 병렬 → (to) experience"], ["❹", "occurs", "주어 phenomenon(단수) + 자동사 → occurs"], ["❺", "leading", "콤마 뒤 결과의 분사구문, '이어지는' 능동 → -ing"]], "note": "※ 수일치에서 지울 수식어 ① 전명구 ② 쉼표-쉼표·대시-대시 삽입 ③ 관계사절 ④ 분사구 → 남는 진짜 주어 찾기", "summary": ""}}, {"no": 32, "src": "6월 38번", "stem": "<b>다음 글의 밑줄 친 부분 중 어법상 <u>어색한<\/u> 것을 두 개 고르면?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Video gaming is one of the most studied technologies with regard to empathy. Because there <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>have been<\/u><\/span> longstanding concerns about the impact of violent video games on youth, much research <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>has conducted<\/u><\/span> over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>witnessing<\/u><\/span> violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. The next step in this problematic process would be having <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>diminished<\/u><\/span> emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, leading to reduced empathy. With repeated exposure to violent events - such as what might happen when a person plays violent video games - this normal reaction might become blunted, a phenomenon known as desensitization. A significant body of work shows an association between extensive violent video gaming and <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>reduce<\/u><\/span> empathy in people."], "notes": [], "bogi": null, "ch": null, "ans": [2, 5], "ex": {"core": [{"key": "❷", "fix": "has conducted → has been conducted", "tag": "능동태 vs 수동태", "lines": ["~, much research [has conducted → has been conducted] (over the last couple of decades) (on the topic).", "→ 전명구 묶으면 타동사 conduct 뒤에 <b>목적어가 없다<\/b> → 수동태 신호!", "→ 연구가 '수행하는' 것 X, '수행되는' 것 O → 현재완료 수동 <b>has been p.p.<\/b>"], "ko": "지난 수십 년 동안 그 주제에 대해 많은 연구가 수행되어 왔다."}, {"key": "❺", "fix": "reduce → reduced", "tag": "동사원형 vs 과거분사", "lines": ["A significant body of work shows an association (between extensive violent video gaming and [reduce → reduced] empathy in people).", "→ between A and B의 B는 명사 자리. 명사 empathy를 앞에서 꾸밀 말 필요 → 동사원형 reduce X", "→ 공감이 '줄어든' 것이므로 수동의 p.p. <b>reduced<\/b>"], "ko": "상당한 양의 연구가 폭력적인 비디오 게임을 많이 하는 것과 사람들의 공감 감소 사이의 연관성을 보여 준다."}], "others": [["❶", "have been", "there + be동사 → 뒤 concerns(복수)에 수일치"], ["❸", "witnessing", "reaction to의 to는 전치사 → 동명사"], ["❹", "diminished", "반응이 '감소된' 것 → 수동의 p.p."]], "note": "※ conduct, make, do 같은 타동사 뒤에 목적어가 없으면 수동태 의심 → has conducted vs has been conducted", "summary": ""}}, {"no": 33, "src": "6월 38번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Video gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>conducted<\/u><\/span> over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>how<\/u><\/span> video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>experiencing<\/u><\/span> physiological arousal that is connected to fear or disgust. With repeated exposure to violent events – such as what might happen when a person plays violent video games – this normal reaction might become blunted, a phenomenon known as desensitization. The next step in this problematic process would be having diminished emotional responses to violence, <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>which<\/u><\/span> could also interfere with the ability to recognize and/or to sympathize with others, causing reduced empathy. A significant body of work shows an association between <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>extensive<\/u><\/span> violent video gaming and reduced empathy in people."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "❸", "fix": "experiencing → (to) experience", "tag": "병렬구조", "lines": ["Part (of a normal, healthy reaction to witnessing violent events) is to feel negative emotions, and [experiencing → (to) experience] physiological arousal ~", "→ 주어 Part + 동사 is + 보어 <b>to feel<\/b> ~, and ___", "→ and는 같은 형태끼리! to feel과 병렬 → <b>(to) experience<\/b> (두 번째 to는 생략 가능)"], "ko": "폭력적인 사건을 목격하는 것에 대한 정상적이고 건강한 반응의 일부는 부정적인 감정을 느끼고, 두려움이나 혐오감과 연결된 생리적 각성을 경험하는 것이다."}], "others": [["❶", "conducted", "연구가 '수행되는' 것 → 수동태 has been p.p."], ["❷", "how", "of의 목적어 명사절 + 뒷문장 완전 → how"], ["❹", "which", "콤마 뒤 + 주어 없는 불완전 → 계속적 용법 which"], ["❺", "extensive", "명사구 violent video gaming 수식 → 형용사"]], "note": "※ 병렬은 and / or / but 앞쪽에서 짝 찾기 → to feel ~ and experience처럼 to 생략형도 옳은 선지로 나옴", "summary": ""}}, {"no": 34, "src": "6월 38번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Video gaming is one of the most studied technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>has been conducted<\/u><\/span> over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>are<\/u><\/span> to feel negative emotions, and to experience physiological arousal <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>that is connected<\/u><\/span> to fear or disgust. With repeated exposure to violent events ─ such as what might happen when a person plays violent video games ─ this normal reaction might become blunted, a phenomenon known as desensitization. The next step in this problematic process would be <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>having diminished<\/u><\/span> emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others. A significant body of work shows an association between extensive violent video gaming and <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>reduced<\/u><\/span> empathy in people."], "notes": [], "bogi": null, "ch": null, "ans": [2], "ex": {"core": [{"key": "❷", "fix": "are → is", "tag": "부분 표현 수일치", "lines": ["Part of a normal, healthy reaction (to witnessing violent events) [are → is] to feel negative emotions, ~", "→ <b>part of + 명사<\/b>는 of 뒤 명사에 수일치 → reaction(단수)", "→ 단수 동사 <b>is<\/b>. events는 witnessing의 목적어일 뿐 주어 X"], "ko": "폭력적인 사건을 목격하는 것에 대한 정상적이고 건강한 반응의 일부는 부정적인 감정을 느끼고, 두려움이나 혐오감과 연결된 생리적 각성을 경험하는 것이다."}], "others": [["❶", "has been conducted", "연구가 '수행되는' 것 + 불가산 research → 단수 수동"], ["❸", "that is connected", "선행사 arousal(단수), '연결된' 것 → 수동"], ["❹", "having diminished", "be의 보어 동명사 + '감소된' 반응 p.p."], ["❺", "reduced", "공감이 '줄어든' 것 → 수동의 p.p."]], "note": "※ part / most / half / some / the rest / 분수 + of + 명사 → of 뒤 명사에 수일치", "summary": ""}}, {"no": 35, "src": "6월 38번", "stem": "<b>다음 글의 밑줄 친 부분 중 어법상 <u>어색한<\/u> 것은? (2개)<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Video gaming is one of the most <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>studied<\/u><\/span> technologies with regard to empathy. Because there have been longstanding concerns about the impact of violent video games on youth, much research has been <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>conducted<\/u><\/span> over the last couple of decades on the topic. While measuring and documenting the impact of video game violence, scientists have formulated credible explanations of how video gaming could affect empathy. Part of a normal, healthy reaction to witnessing violent events is to feel negative emotions, and to experience physiological arousal that is connected to fear or disgust. With <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>repeating<\/u><\/span> exposure to violent events - such as what might happen when a person plays violent video games - this normal reaction might become blunted, a phenomenon known as desensitization. The next step in this problematic process would be having <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>diminished<\/u><\/span> emotional responses to violence, which could also interfere with the ability to recognize and/or to sympathize with others, <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>lead<\/u><\/span> to reduced empathy."], "notes": ["*arousal: 각성"], "bogi": null, "ch": null, "ans": [3, 5], "ex": {"core": [{"key": "❸", "fix": "repeating → repeated", "tag": "현재분사 vs 과거분사", "lines": ["With [repeating → repeated] exposure (to violent events) (- such as what might happen when a person plays violent video games -) this normal reaction might become blunted, ~", "→ 명사 exposure를 앞에서 꾸미는 분사 자리. 꾸밈받는 명사와의 관계로 판단", "→ 노출이 '반복하는' 것 X, '반복되는' 것 O → 수동의 p.p. <b>repeated<\/b>"], "ko": "폭력적인 사건에 반복적으로 노출되면, 이 정상적인 반응은 무뎌질 수 있다."}, {"key": "❺", "fix": "lead → leading", "tag": "동사 vs 준동사", "lines": ["The next step (in this problematic process) would be having diminished emotional responses (to violence), (which could also interfere with the ability ~ with others), [lead → leading] to reduced empathy.", "→ 동사는 이미 would be(주절), could interfere(관계사절). 접속사 없이 동사 lead 추가 X", "→ 콤마 뒤 결과의 분사구문, '~로 이어지는' 능동 → <b>leading to<\/b>"], "ko": "이 문제적 과정의 다음 단계는 폭력에 대한 감정적 반응이 줄어드는 것인데, 이는 타인을 알아보고 공감하는 능력도 방해해 공감 감소로 이어질 수 있다."}], "others": [["❶", "studied", "기술이 '연구된' 것 → 수동의 p.p."], ["❷", "conducted", "연구가 '수행되는' 것 → 수동태 has been p.p."], ["❹", "diminished", "반응이 '감소된' 것 → 수동의 p.p."]], "note": "※ 명사 앞 분사는 꾸밈받는 명사와의 관계로, 콤마 뒤 자리는 문장의 동사 개수부터 세기", "summary": ""}}, {"no": 36, "src": "6월 39번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Realising the benefits of differentiation, some brands broadcast their social purpose before they do much actual good. Their marketers are using social purpose to boost the brand&#x27;s reputation, rather than <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>embracing<\/u><\/span> the purpose itself. Making a real difference with social problems is hard enough; to succeed, it has to <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>follow<\/u><\/span> from an authentic, company-wide commitment to the purpose. Otherwise the mission is just window-dressing, or what we call &quot;purpose-washing&quot; ― similar to green-washing, <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>where<\/u><\/span> purpose-driven activities serve mainly for publicity purposes. We end up with what Anand Giridharadas describes in Winners Take All: &quot;social purpose that just <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>further<\/u><\/span> the charade of elites disrupting the old order without giving much back&quot;. Purpose-washing brands gain one of the benefits of social purpose, differentiation, but only for a short while. They lose out on positioning for future markets, and they might even make employees <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>feel<\/u><\/span> worse about working for them."], "notes": [], "bogi": null, "ch": null, "ans": [4], "ex": {"core": [{"key": "❹", "fix": "further → furthers", "tag": "주격관대 수일치", "lines": ["social purpose that (just) [further → furthers] the charade (of elites disrupting the old order without giving much back)", "→ 주격 관계대명사 that 뒤 동사는 <b>선행사<\/b>에 수일치 → social purpose(단수)", "→ just는 부사일 뿐 → 3인칭 단수 <b>furthers<\/b> (동사 further '~을 조장하다')"], "ko": "기존 질서를 무너뜨리면서도 별로 돌려주지 않는 엘리트들의 가식을 더 부추길 뿐인 사회적 목적"}], "others": [["❶", "embracing", "rather than 앞 are using과 병렬 → -ing"], ["❷", "follow", "has to 뒤 → 동사원형"], ["❸", "where", "뒷문장 완전 → 관계부사 where"], ["❺", "feel", "사역동사 make + 목적어 + 동사원형"]], "note": "※ 관대 뒤 동사 수일치는 선행사 찾기가 핵심 → that과 동사 사이 just / only / often 같은 부사에 속지 말 것", "summary": ""}}, {"no": 37, "src": "6월 40번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것을 있는 대로 모두 고른 것은?<\/b>", "kind": "list", "sym": "①", "n": 5, "p": ["The brain needs to create a model of a constant pulse ― a schema ― so that we know when the musicians are not conforming to it. This is similar to variations of a melody: We need to have a mental representation of <span class=\"mk\">ⓐ<\/span><u>what<\/u> the melody is in order to know ― and appreciate ― when the musician is taking liberties with it. Metrical extraction, knowing what the pulse is and when we expect it <span class=\"mk\">ⓑ<\/span><u>occur<\/u>, is a crucial part of musical emotion. Music communicates to us emotionally through systematic violations of expectations. These violations can occur in any domain ― the domain of pitch, rhythm, tempo, and so on ― but occur <span class=\"mk\">ⓒ<\/span><u>it<\/u> must. Music is organized sound, but the organization has to involve some element of the <span class=\"mk\">ⓓ<\/span><u>unexpected<\/u> or it is emotionally flat and robotic. Too much organization may <span class=\"mk\">ⓔ<\/span><u>technical<\/u> still be music, but it would be music that no one wants to listen to."], "notes": [], "bogi": null, "ch": {"items": ["ⓐ, ⓓ", "ⓐ, ⓓ, ⓔ", "ⓑ, ⓒ, ⓔ", "ⓐ, ⓑ, ⓒ", "ⓑ, ⓓ, ⓔ"]}, "ans": [3], "ex": {"core": [{"key": "ⓐ", "fix": "what (옳음)", "tag": "명사절 what", "lines": ["We need to have a mental representation of [what] the melody is ~", "→ 선행사 없음 + the melody(주어) + is(동사) + 보어 없음 → 불완전", "→ 전치사 of의 목적어 명사절 → <b>what<\/b> ('선율이 무엇인지')"], "ko": "우리는 선율이 무엇인지에 대한 머릿속 표상을 가지고 있어야 한다."}, {"key": "ⓑ", "fix": "occur → to occur (어색함)", "tag": "목적격보어 동사원형 vs to부정사", "lines": ["Metrical extraction, (knowing what the pulse is and when we expect it [occur → to occur],) is a crucial part of musical emotion.", "→ we(주어) + expect(동사) + it(목적어) + ___(목적격보어)", "→ <b>expect + 목적어 + to부정사<\/b> → 동사원형 X, <b>to occur<\/b> O"], "ko": "우리가 그것(박)이 언제 나타날 거라고 예상하는지"}, {"key": "ⓒ", "fix": "it → they (어색함)", "tag": "대명사 수일치", "lines": ["These violations can occur in any domain (― the domain of pitch, rhythm, tempo, and so on ―) but occur [it → they] must.", "→ occur they must = they must occur (동사 occur를 강조하려고 앞으로 보낸 도치)", "→ 가리키는 대상 These violations(복수) → <b>they<\/b>"], "ko": "그러나 그 위반들은 반드시 일어나야 한다."}, {"key": "ⓓ", "fix": "unexpected (옳음)", "tag": "the + 형용사", "lines": ["~ but the organization has to involve some element of the [unexpected] ~", "→ 전치사 of의 목적어 = 명사 자리", "→ <b>the + 형용사<\/b> = 명사 → the unexpected '예상치 못한 것'"], "ko": "그 조직화는 예상치 못한 것의 요소를 어느 정도 포함해야 한다."}, {"key": "ⓔ", "fix": "technical → technically (어색함)", "tag": "형용사 vs 부사", "lines": ["Too much organization may [technical → technically] still be music, ~", "→ 조동사 may와 동사 be 사이 = 동사를 꾸미는 자리", "→ 형용사 X, 부사 <b>technically<\/b> O ('엄밀히 말하면')"], "ko": "지나친 조직화도 엄밀히 말하면 여전히 음악일 수는 있다."}], "others": [], "note": "※ occur they must 같은 동사 강조 도치 → 원래 어순(they must occur)으로 되돌려 대명사 수 확인", "summary": "→ 어색한 것 ⓑ, ⓒ, ⓔ : ③"}}, {"no": 38, "src": "6월 43~45번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 옳은 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["As part of a kindness project, Orange High School students wrote cheerful letters to elders in a countryside village. Anna wrote to Mrs. Pike. She shared about her balcony garden at home and included drawings of flowers. Anna mentioned that despite having limited space, she enjoyed <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>to take<\/u><\/span> care of her plants. Her letter concluded by expressing hope that Mrs. Pike also had a nice garden. After <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>sent<\/u><\/span> the letter, Anna forgot about it until a month later when a package arrived at her home. Anna noticed the box in front of her door. She walked closer and saw it <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>was addressed<\/u><\/span> to her. When Anna opened it, she found a folded letter and a jar of homemade strawberry mint jam from Mrs. Pike. She wrote, &quot;Your words made me smile. I used to have a garden, but when my husband died, I stopped <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>to plant<\/u><\/span>. Your letter <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>was reminded<\/u><\/span> me how much I missed it. So I planted some herbs. Have a taste!&quot; The letter was signed, &quot;Love, Mrs. Pike.&quot;"], "notes": [], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "❸", "fix": "was addressed (옳음)", "tag": "능동태 vs 수동태", "lines": ["She walked closer and saw it [was addressed] (to her).", "→ saw 뒤 명사절 접속사 that 생략. it = 상자(the box)", "→ 상자가 '주소가 적힌' 것 + 뒤에 목적어 없음 → 수동태 <b>was addressed<\/b> O"], "ko": "그녀는 더 가까이 걸어가서 그것이 자기 앞으로 온 것임을 알았다."}], "others": [["❶", "to take", "enjoy + 동명사 → taking"], ["❷", "sent", "전치사 After 뒤 동명사, 능동 → sending"], ["❹", "to plant", "'심던 것을 멈추다' → stop planting"], ["❺", "was reminded", "뒤에 목적어 me, '상기시킨' 능동 → reminded"]], "note": "※ stop / remember / forget / try + to부정사 vs 동명사 → 뜻이 달라지므로 문맥 확인", "summary": ""}}];

const SET_SIZE = 5;
const SYMS={'①':'①②③④⑤','ⓐ':'ⓐⓑⓒⓓⓔ'};
const SETS=[];
for(let i=0;i<PROBLEMS.length;i+=SET_SIZE) SETS.push(PROBLEMS.slice(i,i+SET_SIZE));
function setName(i){return 'Day '+(i+1);}
function sticker(k){return STICKERS[k]||STICKERS.a_00||'';}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function symOf(p,k){return SYMS[p.sym][k-1];}
function gidx(p){return PROBLEMS.indexOf(p);}

let state=PROBLEMS.map(()=>({sel:[],solved:false,revealed:false,firstTryWrong:false}));
let curSet=0,cur=0,view='solve';
const setTabsEl=document.getElementById('setTabs'),probRowEl=document.getElementById('probRow'),stageEl=document.getElementById('stage');

/* progress */
const LSKEY='violet_grammar_g2_m36_v3';
function saveProgress(){try{localStorage.setItem(LSKEY,JSON.stringify({v:2,n:PROBLEMS.length,curSet,cur,view:(view==='score'?'score':'solve'),state}));}catch(e){}}
function loadProgress(){
  try{const raw=localStorage.getItem(LSKEY);if(!raw)return false;const d=JSON.parse(raw);if(!d||d.n!==PROBLEMS.length)return false;
    d.state.forEach((s,i)=>{if(state[i])Object.assign(state[i],s);});
    curSet=Math.min(Math.max(d.curSet||0,0),SETS.length-1);cur=Math.min(Math.max(d.cur||0,0),PROBLEMS.length-1);
    if(d.view==='score'&&setDone(curSet))view='score';
    return state.some(s=>s.revealed||s.sel.length);
  }catch(e){return false;}
}
function resetProgress(){try{localStorage.removeItem(LSKEY);}catch(e){}location.reload();}

/* nav */
function setDone(si){return SETS[si].every(p=>state[gidx(p)].revealed);}
function answeredN(si){return SETS[si].filter(p=>state[gidx(p)].sel.length===p.ans.length).length;}
function renderNav(){
  setTabsEl.innerHTML=SETS.map((s,si)=>'<div class="set-tab'+(si===curSet?' active':'')+(setDone(si)?' done':'')+'" data-s="'+si+'">'+setName(si)+' <span class="tab-sub">'+s[0].no+'~'+s[s.length-1].no+'번</span></div>').join('');
  const done=setDone(curSet);
  let chips='';
  SETS[curSet].forEach(p=>{const i=gidx(p),st=state[i];let cls='nav-chip';
    if(i===cur&&view==='solve')cls+=' active';
    if(done)cls+=st.solved?' solved':' wrongc';else if(st.sel.length===p.ans.length)cls+=' answered';
    chips+='<div class="'+cls+'" data-i="'+i+'"><span class="dot"></span><span class="nav-num">'+p.no+'</span></div>';});
  if(done){
    const wrongN=SETS[curSet].filter(p=>state[gidx(p)].firstTryWrong).length;
    setTabsEl.insertAdjacentHTML('beforeend','<div class="act-box"><button class="score-btn'+(view==='score'?' on':'')+'" id="scoreBtn">📊 결과</button></div>');
  }
  probRowEl.innerHTML=chips;
  setTabsEl.querySelectorAll('.set-tab').forEach(t=>t.addEventListener('click',()=>{curSet=+t.dataset.s;cur=gidx(SETS[curSet][0]);view=setDone(curSet)?'score':'solve';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});}));
  probRowEl.querySelectorAll('.nav-chip').forEach(c=>c.addEventListener('click',()=>{cur=+c.dataset.i;view='solve';renderNav();renderStage();}));
  const sc=document.getElementById('scoreBtn');if(sc)sc.addEventListener('click',()=>{view='score';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});});
  document.getElementById('pfootSet').textContent='고2 어법 · '+setName(curSet);
}

/* 문항 지면 */
function questionHtml(p){
  let h='<div class="qtitle"><span class="qn">'+p.no+'.</span>'+p.stem+'<span class="qsrc">('+p.src+')</span>'
    +(p.ans.length>1?'<span class="multi-badge">정답 '+p.ans.length+'개</span>':'')+'</div>';
  h+='<div class="passage">'+p.p.map(x=>'<p>'+x+'</p>').join('')+'</div>';
  p.notes.forEach(n=>{h+='<div class="fn">'+n+'</div>';});
  if(p.bogi){h+='<div class="bogi"><div class="bogi-t">&lt;보기&gt;</div><div class="bogi-grid">'+p.bogi.map(b=>'<div>'+esc(b)+'</div>').join('')+'</div></div>';}
  if(p.kind==='list'){h+='<div class="clist">'+p.ch.items.map((it,i)=>'<div class="ch" data-k="'+(i+1)+'"><span class="cn">'+symOf(p,i+1)+'</span>'+esc(it)+'</div>').join('')+'</div>';}
  if(p.kind==='table'){
    h+='<table class="ctab"><tr><th></th>'+p.ch.head.map(x=>'<th>'+x+'</th>').join('')+'</tr>'
      +p.ch.rows.map((r,i)=>'<tr class="ch" data-k="'+(i+1)+'"><td>'+symOf(p,i+1)+'</td>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';
  }
  return h;
}
function paintMarks(p,st){
  const fin=st.revealed;
  stageEl.querySelectorAll('.qitem [data-k], .omr button').forEach(el=>{
    const k=+el.dataset.k;el.classList.remove('sel','ok','bad');
    if(fin){ if(p.ans.includes(k))el.classList.add('ok'); else if(st.sel.includes(k))el.classList.add('bad'); }
    else if(st.sel.includes(k))el.classList.add('sel');
  });
}
function toggle(p,st,k){
  if(st.revealed)return;
  const need=p.ans.length;
  if(need===1){st.sel=st.sel[0]===k?[]:[k];}
  else{ if(st.sel.includes(k))st.sel=st.sel.filter(x=>x!==k); else{st.sel.push(k);if(st.sel.length>need)st.sel.shift();} }
  st.sel.sort((a,b)=>a-b);paintMarks(p,st);renderNav();updateGradeRow();saveProgress();
}
function updateGradeRow(){
  const n=answeredN(curSet),tot=SETS[curSet].length;
  const g=document.getElementById('gradeBtn');if(g)g.disabled=n<tot;
  const c=document.getElementById('ansCount');if(c)c.innerHTML='고른 문항 <b>'+n+'</b> / '+tot;
}
function move(d){
  const s=SETS[curSet];const pos=s.indexOf(PROBLEMS[cur]);const np=pos+d;
  if(np<0||np>=s.length)return;cur=gidx(s[np]);view='solve';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});
}

function renderStage(){
  saveProgress();
  if(view==='score'){renderScore();return;}
  const p=PROBLEMS[cur],st=state[cur];const fin=st.revealed;
  const s=SETS[curSet];const pos=s.indexOf(p);
  let h='<div class="qitem'+(fin?' lock':'')+'">'+questionHtml(p)+'</div>';
  if(!fin){
    const syms=SYMS[p.sym];
    h+='<div class="notezone"><div class="note-label">MY ANSWER <span>· 답 고르기</span></div>'
      +'<div class="omr">'+[1,2,3,4,5].map(k=>'<button data-k="'+k+'">'+syms[k-1]+'</button>').join('')+'</div>'
      +'<div class="builder-hint">'+(p.kind==='mark'?'지문의 <b>밑줄 번호</b>를 눌러도 선택돼요. ':'위의 <b>선택지</b>를 눌러도 선택돼요. ')
      +(p.ans.length>1?'이 문항은 <b>'+p.ans.length+'개</b>를 골라야 해요. ':'')+'채점 전까지는 답을 바꿀 수 있어요.</div>'
      +'<div class="row"><button class="nextbtn" id="prevBtn"'+(pos===0?' disabled':'')+'>&larr; 이전</button>'
      +(pos<s.length-1?'<button class="submit" id="nextQ">다음 문항 &rarr;</button>':'')
      +'<span class="try-count" id="ansCount"></span></div>'
      +'<div class="grade-row"><button class="grade" id="gradeBtn" disabled>'+setName(curSet)+' 채점하기</button><span class="grade-hint">'+s.length+'문항을 모두 고르면 채점할 수 있어요. 채점하면 해설이 열려요.</span></div>'
      +'<img class="note-coffee" src="'+sticker('b_06')+'" alt=""></div>';
    h+='<div class="reaction"><img src="'+sticker('b_11')+'" alt=""><div class="bubble">끝까지 <b>시험 보듯</b> 풀어 보자! 5문항 다 고르고 한 번에 채점!</div></div>';
  }else{
    h+='<div class="myres '+(st.solved?'ok':'bad')+'"><span>내 답 <b>'+(st.sel.map(k=>symOf(p,k)).join(', ')||'-')+'</b></span><span class="v">'+(st.solved?'정답':'오답')+'</span></div>';
    h+=revealHtml(p,st.solved);
  }
  stageEl.innerHTML=h;
  stageEl.querySelectorAll('.qitem [data-k], .omr button').forEach(el=>el.addEventListener('click',()=>toggle(p,st,+el.dataset.k)));
  const pb=document.getElementById('prevBtn');if(pb)pb.addEventListener('click',()=>move(-1));
  const nq=document.getElementById('nextQ');if(nq)nq.addEventListener('click',()=>move(1));
  const gb=document.getElementById('gradeBtn');if(gb)gb.addEventListener('click',grade);
  const nb=document.getElementById('nextBtn');if(nb)nb.addEventListener('click',goNext);
  paintMarks(p,st);updateGradeRow();
}
function grade(){
  const s=SETS[curSet];if(answeredN(curSet)<s.length)return;
  if(!confirm('채점하면 답을 바꿀 수 없어요. 채점할까요?'))return;
  s.forEach(p=>{const st=state[gidx(p)];const ok=st.sel.length===p.ans.length&&st.sel.every(k=>p.ans.includes(k));
    st.solved=ok;st.revealed=true;st.firstTryWrong=!ok;});
  view='score';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});
}
function noteGuideHtml(wrong){
  return '<div class="note-guide"><div class="ng-head"><span class="ng-t">오답노트 써 오기</span><span class="ng-nos">틀린 문항: '+wrong.map(p=>'<b>'+p.no+'번</b>').join(', ')+'</span></div>'
    +'<div class="ng-sub">해설을 보고 <b>일반 노트나 이면지</b>에 손으로 정리한 뒤, 사진을 찍어 숙제방에 올리세요. <span class="ng-warn">(오아시스 노트 X)</span><span class="ng-why">오아시스 노트는 선생님이 강조한 문법만 필기해서 여러 번 복습하는 노트예요. 오답노트는 따로 써 주세요.</span></div>'
    +'<ol class="ng-steps">'
    +'<li><b>문항 번호</b>를 쓴다. <span class="ng-eg">예) #02</span></li>'
    +'<li>정답만이 아니라 <b>모든 선지</b>를 한 줄씩: 기호 + 원래 → 고친 형태 + <b>O / X</b> + <b>[쟁점 태그]</b> <span class="ng-eg">예) ⓑ allowed → are allowed O [동사 vs 준동사]</span></li>'
    +'<li>그 아래 <b>해당 문장</b>을 옮겨 쓰고, 수식어는 <b>( )</b>로 묶고 판단할 자리는 <b>[ ]</b>로 표시한다.</li>'
    +'<li><b>빨간 펜</b>으로 근거를 적는다. <span class="ng-eg">예) 주어 + 동사, 조동사 + 동사원형, 사역동사 + 목적어 + 동사원형</span></li>'
    +'</ol>'
    +'<button class="ng-btn" id="noteEx">예시 노트 보기 ▾</button>'
    +'<div id="noteExWrap" hidden><img class="ng-img" src="'+NOTE_EX+'" alt="오답노트 예시"></div></div>';
}
function renderScore(){
  const s=SETS[curSet];const okN=s.filter(p=>state[gidx(p)].solved).length;const wrong=s.filter(p=>!state[gidx(p)].solved);
  const img=okN===s.length?'a_00':(okN>=s.length*0.7?'b_11':'b_14');
  const msg=okN===s.length?'<b>만점!</b> 해설로 다른 선지까지 확인하면 완벽!':'틀린 <b>'+wrong.length+'문항</b>부터 해설을 꼼꼼히 보자. 칸을 누르면 그 문항 해설로 바로 가.';
  let h='<div class="score-card"><div class="score-top"><img src="'+sticker(img)+'" alt=""><div><div class="score-t">'+setName(curSet)+' 채점 결과</div><div class="score-n"><b>'+okN+'</b> / '+s.length+'</div></div></div>'
    +'<div class="score-grid">'+s.map(p=>{const st=state[gidx(p)];return '<div class="sg '+(st.solved?'ok':'bad')+'" data-i="'+gidx(p)+'"><span class="sgn">'+p.no+'</span><span class="sgv">'+(st.solved?'O':'X')+'</span><span class="sga">내 답 '+st.sel.map(k=>symOf(p,k)).join(',')+(st.solved?'':' · 정답 '+p.ans.map(k=>symOf(p,k)).join(','))+'</span></div>';}).join('')+'</div>'
    +'<div class="bubble score-msg">'+msg+'</div>'
    +'<div class="kkam-done"><button class="big" id="firstExp">해설 보기 (처음부터)</button></div></div>'
    +(wrong.length?noteGuideHtml(wrong):'');
  stageEl.innerHTML=h;
  const nb=document.getElementById('noteEx');if(nb)nb.addEventListener('click',()=>{const w=document.getElementById('noteExWrap');w.hidden=!w.hidden;nb.textContent=w.hidden?'예시 노트 보기 ▾':'예시 노트 접기 ▴';});
  stageEl.querySelectorAll('.sg').forEach(el=>el.addEventListener('click',()=>{cur=+el.dataset.i;view='solve';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});}));
  document.getElementById('firstExp').addEventListener('click',()=>{cur=gidx(s[0]);view='solve';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});});
}
function goNext(){
  const s=SETS[curSet];const pos=s.indexOf(PROBLEMS[cur]);
  if(pos<s.length-1)move(1);
  else{view='score';renderNav();renderStage();window.scrollTo({top:0,behavior:'smooth'});}
}
function enLine(t){
  // t may contain <b>; escape nothing else. Gray out ( ... ) groups, highlight [ ... ]
  let h=t.replace(/&lt;/g,'\u0001').replace(/&gt;/g,'\u0002');
  h=h.replace(/\[([^\]]+)\]/g,'<span class="tgt">[$1]</span>');
  // parentheses (non-nested-aware but balanced scan)
  let out='',depth=0;
  for(const ch of h){
    if(ch==='('){ if(depth===0)out+='<span class="par">'; depth++; out+=ch; }
    else if(ch===')'&&depth>0){ out+=ch; depth--; if(depth===0)out+='</span>'; }
    else out+=ch;
  }
  if(depth>0)out+='</span>';
  return out.replace(/\u0001/g,'&lt;').replace(/\u0002/g,'&gt;');
}
function isEn(t){const s=t.replace(/<[^>]+>/g,'');return !/[가-힣]/.test(s)&&/[A-Za-z]{3,}/.test(s)&&!/→/.test(s.slice(0,3));}
function coreHtml(c,compact){
  let h='<div class="cb">';
  if(c.tag)h+='<div class="cb-tag">['+c.tag+']</div>';
  h+='<div class="cb-fix"><span class="lab">'+c.key+'</span>'+c.fix+'</div>';
  const lines=c.lines||[];
  h+='<div class="cb-body">'+lines.map(l=>isEn(l)?'<div class="ln en">'+enLine(l)+'</div>':'<div class="ln">'+l+'</div>').join('')+'</div>';
  if(c.ko&&!compact)h+='<div class="cb-ko">“'+esc(c.ko)+'”</div>';
  return h+'</div>';
}
function revealHtml(p,solved){
  const s=SETS[curSet];const pos=s.indexOf(p);const ex=p.ex;
  const nextLabel=pos<s.length-1?'다음 문항 해설 &rarr;':'채점 결과로 &rarr;';
  return '<div class="reveal"><div class="reveal-head"><img src="'+sticker(solved?'a_00':'b_14')+'" alt="">'+(solved?'정답입니다 · 해설':'정답 공개 · 해설')+'</div><div class="reveal-body">'
    +'<div class="ans-big">정답 <span>'+p.ans.map(k=>symOf(p,k)).join(', ')+'</span></div>'
    +ex.core.map(c=>coreHtml(c,false)).join('')
    +(ex.summary?'<div class="sum-line">'+ex.summary+'</div>':'')
    +(ex.note?'<div class="notebox"><b>※</b> '+ex.note.replace(/^\s*※\s*/,'')+'</div>':'')
    +(ex.others&&ex.others.length?'<div class="sol-label">나머지 선지</div><div class="sol-sub">'+ex.others.map(x=>'<p><span class="lab">'+x[0]+'</span><b class="ow">'+esc(x[1])+'</b>'+x[2]+'</p>').join('')+'</div>':'')
    +(nextLabel?'<div class="next-row"><button class="nextbtn" id="nextBtn">'+nextLabel+'</button></div>':'')
    +'</div></div>';
}
function kkamRef(p){return p.ex.core.map(c=>coreHtml(c,true)).join('')+(p.ex.summary?'<div class="sum-line">'+p.ex.summary+'</div>':'');}

function showResume(){
  const t=document.createElement('div');t.className='resume-toast';
  t.innerHTML='↩️ 지난 진행을 불러왔어요 · <b>'+setName(curSet)+' '+PROBLEMS[cur].no+'번</b>부터 이어서';
  document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),50);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},4200);
}
document.getElementById('resetBtn').addEventListener('click',()=>{if(confirm('지금까지의 진행 상황을 모두 지우고 처음부터 다시 시작할까요?'))resetProgress();});
const _restored=loadProgress();
renderNav();renderStage();
if(_restored)showResume();
</script>
