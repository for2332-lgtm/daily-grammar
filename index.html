<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY GRAMMAR · 고2 3·6월 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --deepest:#4D2D7A; --deep:#804CAD; --mid:#C698E0; --soft:#F5EAFA;
    --gold:#C4955A; --ink:#2B2240; --line:#DCCDED; --boxbg:#F8F5FC; --paper:#EDE6F4;
    --wrong-bg:#FBF1F1; --wrong-border:#E7C9C9; --wrong-ink:#9B4B4B;
    --ok-bg:#F0F7F0; --ok-border:#C8E0C8; --ok-ink:#3E7A45;
    --pen:#1A1A1A;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper);word-break:keep-all;line-height:1.6;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 100px;}
  .sheet{background:#fff;border-radius:16px;padding:22px 24px 20px;position:relative;box-shadow:0 6px 28px rgba(77,45,122,.14);overflow:hidden;}

  /* header (VIOLET 공통) */
  .phead{border-top:4px solid var(--deep);padding-top:11px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
  .pleft{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:24px;letter-spacing:3px;color:var(--deepest);line-height:1;}
  .pcenter{text-align:center;flex:1;}
  .pcenter .t1{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;letter-spacing:5px;color:var(--deep);}
  .pcenter .t2{font-size:10.5px;color:var(--gold);letter-spacing:1px;margin-top:2px;}
  .pright{text-align:right;font-size:10.5px;color:#7A6E92;line-height:1.45;white-space:nowrap;}
  .pright b{color:var(--deepest);}
  .goldline{height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin:6px 0 16px;}

  /* set tabs / chips */
  .set-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .set-tab{font-size:13px;font-weight:600;color:#8B7DA6;background:#fff;border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer;transition:all .15s;}
  .set-tab.active{background:var(--soft);border-color:var(--deep);color:var(--deepest);font-weight:700;}
  .set-tab.done::after{content:"✓";margin-left:5px;color:var(--ok-ink);font-weight:800;}
  .prob-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px dashed var(--line);}
  .nav-chip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;color:#8B7DA6;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
  .nav-chip.active{background:var(--deep);border-color:var(--deep);color:#fff;}
  .nav-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
  .nav-chip.solved .dot{background:var(--ok-ink);}
  .nav-chip.opened .dot{background:var(--gold);}
  .nav-chip.active .dot{background:#EAD9F5;}
  .nav-num{font-family:'Pretendard',sans-serif;font-weight:700;font-size:15px;}
  .kkam-btn{margin-left:auto;border:1.5px solid var(--gold);background:#FFFDF6;color:#8a6a2e;border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR';}
  .kkam-btn:disabled{opacity:.45;cursor:default;}
  .kkam-btn.ready{background:var(--gold);color:#fff;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(196,149,90,.4);}50%{box-shadow:0 0 0 6px rgba(196,149,90,0);}}

  /* ===== 문항: 한글(hwpx) 지면 재현 ===== */
  .qitem{border:1px solid var(--line);border-radius:12px;padding:22px 24px 20px;background:#fff;margin-bottom:16px;}
  .qitem, .qitem *{font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;}
  .qtitle{font-size:18.5px;line-height:1.6;color:var(--pen);text-align:justify;margin-bottom:12px;}
  .qtitle .qn{font-weight:800;margin-right:4px;}
  .qtitle b{font-weight:700;}
  .qtitle u{text-decoration-thickness:1.5px;text-underline-offset:3px;}
  .qsrc{font-weight:500;color:#6F6683;font-size:16px;margin-left:4px;white-space:nowrap;}
  .multi-badge{display:inline-block;vertical-align:2px;margin-left:6px;background:var(--gold);color:#fff;font-size:12px;font-weight:700;border-radius:20px;padding:2px 10px;}
  .passage{font-size:19px;line-height:1.85;font-weight:500;color:var(--pen);text-align:justify;word-break:keep-all;overflow-wrap:break-word;hyphens:none;}
  .passage p{text-indent:.3em;margin:0;}
  .passage p+p{margin-top:.2em;}
  .passage u{text-decoration:underline;text-decoration-thickness:1.3px;text-underline-offset:4px;text-decoration-skip-ink:none;}
  .mk{font-weight:600;margin-right:2px;font-size:1.12em;line-height:1;}
  .opt{cursor:pointer;border-radius:5px;padding:1px 2px;transition:background .12s, box-shadow .12s;-webkit-user-select:none;user-select:none;}
  .opt.sel{background:#E9DAF7;box-shadow:0 0 0 1.5px var(--deep) inset;}
  .opt.sel .mk{color:var(--deep);}
  .opt.elim{color:#A99FB8;}
  .opt.elim u{text-decoration-color:#C9BFD6;}
  .opt.ok{background:#DCEFDC;box-shadow:0 0 0 1.5px var(--ok-ink) inset;}
  .opt.bad{background:#F6DEDE;box-shadow:0 0 0 1.5px #C99 inset;}
  .lock .opt{cursor:default;}
  .br{white-space:nowrap;}
  .br .brl{font-weight:700;}
  .br i{font-style:normal;color:#555;}
  .fn{font-size:16px;color:#333;margin-top:10px;text-align:right;}
  .bogi{border:1.3px solid #444;border-radius:2px;padding:16px 16px 12px;margin:18px 0 6px;position:relative;}
  .bogi-t{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#fff;padding:0 10px;font-size:16px;font-weight:700;color:var(--pen);}
  .bogi-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:17.5px;font-weight:500;color:var(--pen);}
  .clist{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-top:16px;}
  .ch{font-size:18px;font-weight:500;color:var(--pen);padding:6px 10px;border-radius:8px;cursor:pointer;border:1.5px solid transparent;transition:all .12s;}
  .ch .cn{font-weight:600;margin-right:8px;font-size:1.15em;}
  .ctab{border-collapse:collapse;margin-top:16px;font-size:18px;font-weight:500;color:var(--pen);}
  .ctab th{font-weight:700;padding:4px 16px 6px;text-align:left;}
  .ctab td{padding:6px 16px;}
  .ctab td:first-child{padding-left:10px;font-weight:600;font-size:1.15em;}
  .ctab tr.ch{display:table-row;}
  .ctab tr.ch td{border-top:1.5px solid transparent;border-bottom:1.5px solid transparent;}
  .ctab tr.ch td:first-child{border-left:1.5px solid transparent;border-radius:8px 0 0 8px;}
  .ctab tr.ch td:last-child{border-right:1.5px solid transparent;border-radius:0 8px 8px 0;}
  .ch.sel, .ctab tr.ch.sel td{background:#E9DAF7;border-color:var(--deep);}
  .ch.elim, .ctab tr.ch.elim td{color:#A99FB8;}
  .ch.ok, .ctab tr.ch.ok td{background:#DCEFDC;border-color:var(--ok-ink);}
  .ch.bad, .ctab tr.ch.bad td{background:#F6DEDE;border-color:#C99;}
  .lock .ch{cursor:default;}

  /* answer zone */
  .notezone{position:relative;margin-top:18px;border:1.5px solid var(--line);border-radius:14px;background:radial-gradient(var(--line) 1px, transparent 1px);background-size:17px 17px;background-color:#FCFAFE;padding:16px 16px 14px;}
  .note-label{display:inline-block;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:13px;letter-spacing:2px;color:var(--deep);background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px 12px;margin-bottom:12px;}
  .note-label span{font-family:'Noto Sans KR';font-weight:700;font-size:11px;letter-spacing:0;color:#9485AE;}
  .omr{display:flex;gap:12px;flex-wrap:wrap;}
  .omr button{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--deepest);font-size:27px;line-height:1;cursor:pointer;font-family:'Pretendard',sans-serif;transition:all .12s;}
  .omr button:active{transform:scale(.94);}
  .omr button.sel{background:var(--deep);border-color:var(--deep);color:#fff;}
  .omr button.elim{opacity:.35;text-decoration:line-through;cursor:default;}
  .omr button.ok{background:var(--ok-ink);border-color:var(--ok-ink);color:#fff;}
  .omr button.bad{background:#C99;border-color:#C99;color:#fff;}
  .builder-hint{font-size:13px;color:#7A6E92;margin-top:10px;}
  .builder-hint b{color:var(--deep);}
  .row{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  button.submit{background:var(--deep);color:#fff;border:none;border-radius:10px;padding:13px 30px;font-size:15px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  button.submit:disabled{background:#C9BED6;}
  .try-count{font-size:13px;color:#7A6E92;}
  .try-count b{color:var(--deep);font-size:15px;}
  .note-coffee{position:absolute;bottom:8px;right:12px;width:50px;opacity:.9;pointer-events:none;}

  .log-title{font-size:11.5px;font-weight:700;color:#9485AE;letter-spacing:.05em;margin:20px 0 9px;}
  .attempt{border:1px solid var(--line);border-radius:11px;padding:10px 15px;margin-bottom:8px;background:#fff;display:flex;align-items:center;gap:10px;font-size:14px;animation:pop .28s ease;}
  .attempt.wrong{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong-ink);}
  .attempt.correct{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-ink);}
  .try-badge{background:var(--mid);color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:800;}
  .attempt.wrong .try-badge{background:#C99;}
  .attempt.correct .try-badge{background:var(--ok-ink);}
  .attempt .pick{font-family:'Pretendard';font-size:18px;font-weight:600;}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:none;}}

  .reaction{display:flex;align-items:center;gap:12px;margin-top:16px;min-height:64px;}
  .reaction img{width:66px;height:auto;filter:drop-shadow(0 3px 5px rgba(77,45,122,.16));animation:bob .5s ease;}
  @keyframes bob{from{transform:translateY(8px) scale(.9);opacity:0;}to{transform:none;opacity:1;}}
  .bubble{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px;font-size:14px;color:var(--ink);font-weight:500;max-width:560px;}
  .bubble::before{content:"";position:absolute;left:-8px;top:22px;width:14px;height:14px;background:#fff;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);transform:rotate(45deg);}
  .bubble b{color:var(--deep);}

  /* reveal */
  .reveal{margin-top:20px;border:1px solid var(--line);border-radius:14px;overflow:hidden;animation:pop .35s ease;}
  .reveal-head{background:var(--deepest);color:#fff;padding:11px 18px;font-size:13.5px;font-weight:700;letter-spacing:.05em;display:flex;align-items:center;gap:10px;}
  .reveal-head img{width:40px;height:auto;}
  .reveal-body{padding:18px 20px;background:#fff;font-family:'Pretendard',sans-serif;}
  .ans-big{display:inline-flex;align-items:center;gap:10px;background:var(--ok-bg);border:1px solid var(--ok-border);border-radius:10px;padding:8px 16px;font-size:16px;font-weight:700;color:#2f4a33;margin-bottom:6px;}
  .ans-big span{font-size:24px;font-weight:700;}
  .sol-label{font-size:12px;font-weight:700;color:var(--deep);letter-spacing:.04em;margin:16px 0 8px;font-family:'Noto Sans KR';}
  .cb{background:#FBF8FE;border:1px solid var(--line);border-left:4px solid var(--deep);border-radius:10px;padding:14px 18px 15px;margin:14px 0 12px;}
  .cb-tag{display:inline-block;font-size:16px;font-weight:800;color:var(--deep);margin-bottom:4px;}
  .cb-fix{font-size:18.5px;font-weight:700;color:var(--deepest);line-height:1.6;margin-bottom:8px;}
  .cb-body .ln{font-size:17px;line-height:1.75;color:var(--pen);margin-bottom:5px;}
  .cb-body .ln b{color:var(--deepest);}
  .cb-body .ln.en{font-size:17.5px;font-weight:500;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 0 8px;text-indent:0;}
  .ln.en .par{color:#9A90AA;}
  .ln.en .tgt{color:var(--deep);font-weight:700;}
  .cb-ko{font-size:16px;color:#5f566f;margin-top:6px;}
  .sum-line{font-size:17px;font-weight:700;color:var(--deepest);margin:4px 0 6px 4px;}
  .notebox{background:linear-gradient(180deg,#FFFDF6,#FDF7EA);border:1px solid #E9D8B4;border-left:4px solid var(--gold);border-radius:10px;padding:11px 15px;margin-top:6px;font-size:16.5px;line-height:1.7;}
  .notebox > b:first-child{color:#8a6a2e;}
  .sol-sub p{font-size:16.5px;line-height:1.7;color:#3a3348;margin:0 0 7px;}
  .sol-sub .ow{margin-right:8px;color:var(--pen);}
  .tab-sub{font-size:11px;font-weight:500;color:#A99FB8;margin-left:3px;}
  .set-tab.active .tab-sub{color:var(--deep);}
  .nav-chip.answered .dot{background:var(--deep);}
  .nav-chip.answered{border-color:var(--mid);color:var(--deep);}
  .nav-chip.wrongc .dot{background:#C55;}
  .nav-chip.wrongc{border-color:#E7C9C9;color:var(--wrong-ink);}
  .nav-chip.solved{border-color:var(--ok-border);color:var(--ok-ink);}
  .nav-chip.active{color:#fff;}
  .act-box{margin-left:auto;display:flex;gap:6px;}
  .score-btn{border:1.5px solid var(--deep);background:#fff;color:var(--deep);border-radius:10px;padding:7px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR';}
  .score-btn.on{background:var(--soft);}
  .act-box .kkam-btn{margin-left:0;}
  button.nextbtn:disabled{opacity:.4;cursor:default;}
  .grade-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
  button.grade{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:13px 26px;font-size:15px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  button.grade:disabled{background:#E3D7C4;cursor:default;}
  .grade-hint{font-size:12.5px;color:#7A6E92;padding-right:56px;}
  .myres{display:flex;justify-content:space-between;align-items:center;border-radius:11px;padding:11px 16px;margin-top:14px;font-size:15px;}
  .myres b{font-family:'Pretendard';font-size:19px;}
  .myres.ok{background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok-ink);}
  .myres.bad{background:var(--wrong-bg);border:1px solid var(--wrong-border);color:var(--wrong-ink);}
  .myres .v{font-weight:800;}
  .score-card{border:1.5px solid var(--line);border-radius:16px;padding:20px;background:linear-gradient(180deg,#fff,#FBF7FE);}
  .score-top{display:flex;align-items:center;gap:16px;margin-bottom:16px;}
  .score-top img{width:78px;}
  .score-t{font-size:14px;font-weight:700;color:var(--deep);}
  .score-n{font-family:'Pretendard';font-size:20px;color:#7A6E92;}
  .score-n b{font-size:42px;color:var(--deepest);}
  .score-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px;}
  .sg{border-radius:10px;padding:9px 6px;text-align:center;cursor:pointer;border:1.5px solid;display:flex;flex-direction:column;gap:1px;}
  .sg.ok{background:var(--ok-bg);border-color:var(--ok-border);color:var(--ok-ink);}
  .sg.bad{background:var(--wrong-bg);border-color:var(--wrong-border);color:var(--wrong-ink);}
  .sgn{font-family:'Pretendard';font-weight:700;font-size:15px;}
  .sgv{font-size:22px;font-weight:800;line-height:1.1;}
  .sga{font-size:11px;font-family:'Pretendard';}
  .score-msg{margin:0 auto 14px;max-width:none;}
  .score-msg::before{display:none;}
  .note-guide{margin-top:16px;border:1.5px solid #E9D8B4;border-left:5px solid var(--gold);border-radius:14px;background:linear-gradient(180deg,#FFFDF6,#FDF7EA);padding:18px 20px;}
  .ng-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .ng-t{font-size:18px;font-weight:800;color:#8a6a2e;}
  .ng-nos{font-size:15px;color:var(--ink);}
  .ng-nos b{color:var(--wrong-ink);}
  .ng-sub{font-size:15.5px;color:var(--ink);margin-bottom:10px;}
  .ng-steps{margin:0 0 12px 22px;display:flex;flex-direction:column;gap:8px;font-size:15.5px;line-height:1.65;color:var(--ink);}
  .ng-steps b{color:var(--deepest);}
  .ng-eg{display:block;font-size:14px;color:#7A6E92;font-family:'Pretendard',sans-serif;}
  .ng-warn{color:var(--wrong-ink);font-weight:700;white-space:nowrap;}
  .ng-why{display:block;font-size:13.5px;color:#7A6E92;margin-top:4px;}
  .ng-btn{background:#fff;border:1.5px solid #E0C994;color:#8a6a2e;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  .ng-img{display:block;max-width:100%;width:520px;margin-top:12px;border-radius:10px;border:1px solid var(--line);}
  .lab{display:inline-block;min-width:26px;text-align:center;background:var(--soft);border:1px solid var(--line);color:var(--deepest);font-size:14px;font-weight:700;border-radius:6px;padding:0 6px;margin-right:7px;}
  .next-row{display:flex;justify-content:flex-end;margin-top:16px;}
  button.nextbtn{background:#fff;color:var(--deep);border:1.5px solid var(--line);border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}

  .pfoot{display:flex;justify-content:space-between;font-size:10px;color:#9485AE;border-top:1px solid var(--line);padding-top:9px;margin-top:20px;}
  .pfoot .serif{letter-spacing:2px;color:var(--deep);}
  .foot-note{margin-top:16px;font-size:11.5px;color:#9485AE;text-align:center;line-height:1.7;}
  .reset-link{color:var(--deep);font-weight:700;text-decoration:underline;cursor:pointer;}
  .resume-toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-24px);opacity:0;transition:all .35s ease;z-index:80;background:var(--deepest);color:#fff;font-size:13px;font-weight:600;padding:10px 18px;border-radius:22px;box-shadow:0 6px 20px rgba(77,45,122,.35);white-space:nowrap;}
  .resume-toast.show{opacity:1;transform:translate(-50%,0);}
  .resume-toast b{color:#EAD9F5;}

  /* 깜지 */
  .kkam-head .t{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;letter-spacing:2px;color:var(--deepest);}
  .kkam-sub{font-size:13px;color:#7A6E92;margin:4px 0 14px;}
  .kkam-name{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .kkam-name label{font-size:12.5px;font-weight:700;color:var(--deep);}
  .kkam-name input{border:1.5px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px;font-family:'Noto Sans KR';color:var(--ink);}
  .kkam-card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px;background:#fff;}
  .kkam-ref{font-family:'Pretendard',sans-serif;}
  .kkam-instr{font-size:12.5px;color:#9485AE;margin:9px 0 8px;}
  .kkam-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .kkam-toolbar button{border:1.5px solid var(--line);background:#fff;color:var(--deep);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  .kkam-toolbar button.on{background:var(--deep);color:#fff;border-color:var(--deep);}
  .kkam-toolbar .sp{margin-left:auto;font-size:11.5px;color:#9485AE;}
  .canvas-box{position:relative;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;touch-action:none;}
  .canvas-box canvas{display:block;width:100%;touch-action:none;}
  .kkam-done{display:flex;gap:12px;justify-content:center;margin-top:8px;}
  button.big{background:var(--deep);color:#fff;border:none;border-radius:12px;padding:14px 30px;font-size:15px;font-weight:700;font-family:'Noto Sans KR';cursor:pointer;}
  button.big.ghost{background:#fff;color:var(--deep);border:1.5px solid var(--line);}
  .comp-card{border:2px solid var(--deep);border-radius:16px;padding:22px;background:linear-gradient(180deg,#fff,#FBF7FE);text-align:center;}
  .comp-stamp{display:inline-block;transform:rotate(-8deg);border:3px solid var(--gold);color:var(--gold);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:20px;letter-spacing:2px;padding:6px 18px;border-radius:10px;margin-bottom:14px;}
  .comp-line{font-size:14px;color:var(--ink);margin:4px 0;}
  .comp-line b{color:var(--deepest);}
  .comp-thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .comp-thumbs img{width:120px;border:1px solid var(--line);border-radius:8px;}
  .comp-shot{font-size:12.5px;color:var(--deep);font-weight:700;background:var(--soft);border:1px dashed var(--mid);border-radius:10px;padding:10px;margin-top:12px;}
  .comp-mascot{width:70px;margin:0 auto 6px;display:block;}

  @media (max-width:600px){
    .score-grid{grid-template-columns:repeat(3,1fr);}

    .sheet{padding:18px 14px;} .qitem{padding:16px 14px;}
    .passage{font-size:17px;} .qtitle{font-size:17px;}
    .clist,.bogi-grid{grid-template-columns:1fr;}
    .omr button{width:50px;height:50px;font-size:23px;}
  }
</style>
</head>

const PROBLEMS = [{"no": 1, "src": "3월 19번", "stem": "<b>다음 글의 밑줄 친 부분 중 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["<span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>Looking around<\/u><\/span> the noisy cafeteria, Oliver gripped his tray tightly. He felt the heavy weight of being new to the school. Not knowing <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>how would the day go<\/u><\/span> made him <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>feel anxious<\/u><\/span>. He sat with a heavy sigh at a corner table. He thought, &#x27;Can I make it through the rest of the day?&#x27; Just then, a plastic tray <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>was placed<\/u><\/span> down opposite him. It was a boy from his math class. &quot;Hey, is this seat taken? By the way, thanks for lending me that pen earlier.&quot; The invisible wall around Oliver seemed to melt away. &quot;Not at all, please sit,&quot; he replied. <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>As he started to<\/u><\/span> feel at ease, he smiled brightly at the boy."], "notes": [], "bogi": null, "ch": null, "ans": [2], "ex": {"core": [{"key": "❷", "fix": "how would the day go → how the day would go", "tag": "의문문 어순 vs 간접의문문 어순", "lines": ["Not knowing [how would the day go → how the day would go] made him feel anxious.", "→ 동명사 knowing의 목적어 자리, 즉 명사 자리에 의문문이 들어갔다.", "→ 문장 속에 들어간 의문문(간접의문문)은 <b>의문사 + 주어 + 동사<\/b> 어순!", "How would the day go? (의문문) → how the day would go (간접의문문)"], "ko": "하루가 어떻게 흘러갈지 몰라서 그는 불안해졌다."}], "others": [["❶", "Looking around", "Oliver가 '둘러보는' 것 → 능동의 분사구문"], ["❸", "feel anxious", "사역동사 made + 목적어 + 동사원형 / feel + 형용사 보어"], ["❹", "was placed", "쟁반이 '놓인' 것 → 수동태"], ["❺", "As he started to", "뒤가 완전한 절 → '~하면서' 접속사 as"]], "note": "※ 의문사가 없는 간접의문문은 <b>if / whether + 주어 + 동사<\/b> → 내신 변형 단골", "summary": ""}}, {"no": 2, "src": "3월 21번", "stem": "<b>다음 ⓐ~ⓔ를 어법에 맞게 수정한 것으로 옳은 것만을 &lt;보기&gt;에서 있는 대로 고른 것은?<\/b>", "kind": "list", "sym": "①", "n": 5, "p": ["A first step toward establishing a respectful classroom learning community is acceptance of all ideas and answers – regardless of any obvious errors. Rich mathematical discussions cannot <span class=\"mk\">ⓐ<\/span><u>occurring<\/u> if this expectation is not in place. We must remember that wrong answers are often rooted in misconceptions, and unless these ideas <span class=\"mk\">ⓑ<\/span><u>allowed<\/u> to be brought to the forefront, we cannot help students confront their thinking. Students who are in safe learning environments are willing to risk sharing an incorrect answer with their peers in order to make themselves <span class=\"mk\">ⓒ<\/span><u>growing<\/u> mathematically. It is important to model and expect the acceptance of all ideas without derogatory comments. As educators we can model this by recording all answers to be considered without giving any verbal or physical expressions that <span class=\"mk\">ⓓ<\/span><u>indicates<\/u> agreement or disagreement with any answer. The teacher may need to practice suppressing evaluative responses to students&#x27; answers. Students look to teachers as the source of correct answers. Part of building a safe learning community <span class=\"mk\">ⓔ<\/span><u>shift<\/u> this source of knowledge to the students by equipping them to defend the thinking behind their solutions."], "notes": ["*derogatory: 비하하는"], "bogi": ["ⓐ occurring → occurred", "ⓑ allowed → are allowed", "ⓒ growing → grow", "ⓓ indicates → indicate", "ⓔ shift → shifting"], "ch": {"items": ["ⓐ, ⓑ", "ⓐ, ⓒ", "ⓐ, ⓑ, ⓓ", "ⓑ, ⓒ, ⓓ", "ⓒ, ⓓ, ⓔ"]}, "ans": [4], "ex": {"core": [{"key": "ⓐ", "fix": "occurring → occurred (틀린 수정, 바른 형태: occur)", "tag": "조동사 + 동사원형", "lines": ["Rich mathematical discussions cannot [occurring] (if this expectation is not in place).", "→ 조동사 cannot 바로 뒤 → <b>동사원형<\/b> 자리다.", "cannot occurred (X) / cannot occurring (X) / cannot occur (O) → 틀린 수정"], "ko": "이러한 p": ["Most performance lighting is made up of a number of different looks <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>which<\/u><\/span> we have called lighting states. Each lighting cue <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>triggers<\/u><\/span> a change to a new state. Like actors, lighting cues usually need a motivation. This might be something very obvious such as a cue required <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>to brighten<\/u><\/span> a room setting when an actor turns on a light switch or the rapid increase in intensity at the end of a dance number in a traditional musical (known as a button cue). At other times we will need a cue to provide a subtle change in atmosphere over a number of minutes, motivated perhaps by the mention of a sunset or the intention to <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>slowly<\/u><\/span> change the feel of the performance from normal to threatening. The question, &#x27;What will lighting do for this production?&#x27; <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>needing<\/u><\/span> to be asked for each moment of the production, each dramatic unit or scene, and each transition."], "notes": [], "bogi": null, "ch": null, "ans": [5], "ex": {"core": [{"key": "❺", "fix": "needing → needs", "tag": "동사 vs 준동사", "lines": ["The question, ('What will lighting do for this production?') [needing → needs] to be asked (for each moment of the production, ~).", "→ 따옴표 속 질문은 The question의 내용을 설명하는 삽입 → 묶고 없는 셈 치기!", "→ 남는 것은 주어 The question인데 동사가 없다 → -ing형이 아닌 <b>동사<\/b>가 필요", "→ 주어가 단수(The question) → needs"], "ko": "'조명이 이 작품을 위해 무엇을 할 것인가?'라는 질문은 작품의 매 순간, 각 극적 단위나 장면, 그리고 각 전환마다 던져져야 한다."}], "others": [["❶", "which", "call A B에서 A가 빠진 불완전한 문장 → 목적격 관대"], ["❷", "triggers", "주어 Each lighting cue(단수) → triggers"], ["❸", "to brighten", "a cue required to V → '~하는 데 필요한' 큐"], ["❹", "slowly", "동사 change를 꾸밈 → 부사 slowly"]], "note": "※ 주어 뒤에 삽입구·따옴표 문장·긴 수식어가 끼면 동사 자리가 비어 있지 않은지 확인 → needs를 needing / to need로 바꿔 내는 변형 주의", "summary": ""}}, {"no": 4, "src": "3월 26번", "stem": "<b>다음 글의 밑줄 친 부분 중 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Dennis William Sciama was born in Manchester, England, in 1926. He received an education in mathematics and physics at Malvern College. Despite his father&#x27;s wish for him to take over the family business, Sciama chose to continue pursuing his academic career. After he <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>earned<\/u><\/span> a doctoral degree in physics from the University of Cambridge in 1953, he became famous for his research on the universe. Early in his career, Sciama supported the steady-state theory, which argued that the universe had no beginning. However, when new evidence against the theory <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>was appeared<\/u><\/span> in the 1960s, his view <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>was changed<\/u><\/span> and accepted the Big Bang model. In 1991, he was awarded the Guthrie Medal for outstanding contributions to experimental physics by the British Institute of Physics. Sciama&#x27;s role as a mentor became known even outside academic circles. Later, he <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>was introduced<\/u><\/span> in films about his most famous student, Stephen Hawking, which made Sciama <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>known<\/u><\/span> to a wider audience."], "notes": [], "bogi": null, "ch": null, "ans": [2], "ex": {"core": [{"key": "❷", "fix": "was appeared → appeared", "tag": "자동사 vs 타동사", "lines": ["However, when new evidence (against the theory) [was appeared → appeared] (in the 1960s), ~", "→ appear(나타나다)는 목적어를 갖지 않는 <b>자동사<\/b>", "→ 수동태는 목적어가 주어 자리로 간 것 → 목적어가 없는 자동사는 수동태 불가!", "※ happen, occur, disappear, arise, remain도 마찬가지"], "ko": "그러나 1960년대에 그 이론에 반하는 새로운 증거가 나타났을 때"}], "others": [["❶", "earned", "1953년 과거의 일 + 그가 '받은' 능동 → earned"], ["❸", "was changed", "그의 견해가 '바뀐' 것 → 수동태 자체는 가능. 단 and accepted의 주어도 his view가 되어 의미가 어색하다(원문: he changed his view and accepted)"], ["❹", "was introduced", "그가 영화에서 '소개된' 것 → 수동태"], ["❺", "known", "made + Sciama + 목적격보어, '알려지는' 수동 → p.p."]], "note": "※ 자동사를 be p.p.로 바꿔 수동태 오류를 만드는 문제가 단골 → 먼저 '목적어를 가질 수 있는 동사인가?'를 확인", "summary": ""}}, {"no": 5, "src": "3월 30번", "stem": "<b>다음 (A), (B), (C), (D)의 괄호 안에서 어법상 알맞은 표현을 모두 고른 것은?<\/b>", "kind": "table", "sym": "①", "n": 5, "p": ["In a thesis-based doctoral programme, students typically spend a significant amount of time and effort researching a specific topic. While this deep dive into a particular area allows for thorough exploration and understanding, it can also result in <span class=\"br\"><span class=\"brl\">(A)<\/span>[narrow <i>/<\/i> narrowing]<\/span> the focus. As students become deeply <span class=\"br\"><span class=\"brl\">(B)<\/span>[absorbed <i>/<\/i> absorbing]<\/span> in their research, they may spend less time exploring related fields or acquiring skills outside their immediate area of study. Consequently, this singular focus may limit the breadth of knowledge and skills developed during the programme, potentially hindering students&#x27; ability to adapt to diverse career paths or <span class=\"br\"><span class=\"brl\">(C)<\/span>[to address <i>/<\/i> addressing]<\/span> interdisciplinary challenges. Some universities in Europe have recognised the limitations of traditional thesis-based doctoral programmes and have started to implement more structured approaches. These structured programmes often <span class=\"br\"><span class=\"brl\">(D)<\/span>[combine <i>/<\/i> combining]<\/span> research with coursework and training in transferable skills. By incorporating coursework, seminars, workshops and internships into the curriculum, they aim to provide students with a broader skill set and better prepare them for a variety of career paths beyond academia."], "notes": [], "bogi": null, "ch": {"head": ["(A)", "(B)", "(C)", "(D)"], "rows": [["narrow", "absorbing", "to address", "combine"], ["narrow", "absorbing", "addressing", "combining"], ["narrowing", "absorbing", "to address", "combine"], ["narrowing", "absorbed", "addressing", "combining"], ["narrowing", "absorbed", "to address", "combine"]]}, "ans": [5], "ex": {"core": [{"key": "(A)", "fix": "narrowing (O) / narrow (X)", "tag": "전치사 + 동명사", "lines": ["~ it can also result in [narrow / narrowing] the focus.", "→ 전치사 in 뒤 → 명사 또는 <b>동명사<\/b> 자리", "→ 뒤에 목적어 the focus가 있다 → 목적어를 가질 수 있는 동명사 narrowing", "※ result in + 명사/동명사: ~라는 결과를 낳다"], "ko": "그것은 또한 초점을 좁히는 결과를 낳을 수도 있다."}, {"key": "(B)", "fix": "absorbed (O) / absorbing (X)", "tag": "현재분사 vs 과거분사", "lines": ["As students become deeply [absorbed / absorbing] (in their research), they may spend less time ~", "→ become 뒤 주격보어 자리. absorb는 '(마음을) 빠져들게 하다'", "→ 학생들이 연구에 '빠져들게 되는' 것 → 수동의 <b>p.p.<\/b> absorbed", "※ be/become absorbed in ~: ~에 몰두하다"], "ko": "학생들이 자신의 연구에 깊이 몰두하게 되면서"}, {"key": "(C)", "fix": "to address (O) / addressing (X)", "tag": "병렬구조", "lines": ["~ potentially hindering students' ability to adapt (to diverse career paths) or [to address / addressing] interdisciplinary challenges.", "→ or 앞뒤는 같은 형태로! ability를 꾸미는 to adapt와 나란히 → to address", "→ ability to adapt ~ or to address ~: '적응할 능력' 또는 '다룰 능력'"], "ko": "잠재적으로 학생들이 다양한 진로에 적응하거나 학제 간 과제를 다루는 능력을 저해할 수 있다"}, {"key": "(D)", "fix": "combine (O) / combining (X)", "tag": "동사 vs 준동사", "lines": ["These structured programmes (often) [combine / combining] research (with coursework and training in transferable skills).", "→ 빈도부사 often, 전명구 묶고 나면 주어 programmes 뒤에 동사가 없다", "→ <b>동사<\/b> 자리 + 복수 주어 → combine"], "ko": "이러한 구조화된 프로그램은 흔히 연구를 교과 과정 및 전이 가능한 기술 훈련과 결합한다."}], "others": [], "note": "※ 전치사 뒤 동명사 / absorbed·absorbing 같은 분사형 형용사 / 병렬 to부정사 → 괄호 고르기가 서술형 '틀린 곳 고쳐 쓰기'로 바뀌어 자주 출제", "summary": "→ narrowing – absorbed – to address – combine : ⑤"}}, {"no": 6, "src": "3월 31번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Research shows that, by age three, children understand that imaginary objects do not come to life. This is especially clear with respect to everyday objects – children know <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>that<\/u><\/span> even though they imagine a pencil in an empty box, the box will remain empty. However, emotion can sometimes disrupt this understanding, or at least its expression. That is, even though a child knows that monsters are not real, the thought of a monster under a bed might be enough to make a child <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>refuse<\/u><\/span> to go into his room at night. Indeed, research shows that children have a more difficult time <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>displaying<\/u><\/span> their understanding of the causal relations between imagination and reality when they are asked to pretend or imagine scary things, like monsters. In one study, preschool children <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>showed<\/u><\/span> an empty box and were asked to imagine a monster inside. All children agreed that the box was empty. However, <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>when<\/u><\/span> they were left alone with the box they exhibited fear and avoidance of it."], "notes": [], "bogi": null, "ch": null, "ans": [4], "ex": {"core": [{"key": "❹", "fix": "showed → were shown", "tag": "능동태 vs 수동태 (4형식)", "lines": ["(In one study), preschool children [showed → were shown] an empty box and were asked to imagine a monster inside.", "→ show A B: A에게 B를 보여 주다. 아이들은 보여 준 쪽이 아니라 '보게 된(보여진)' 쪽 → <b>수동태<\/b>", "→ 4형식의 수동태라 be shown 뒤에 목적어 an empty box가 그대로 남는다. 뒤의 were asked와도 나란히 수동", "Researchers showed children an empty box. → Children were shown an empty box."], "ko": "한 연구에서 미취학 아동들은 빈 상자를 보았고, 그 안에 괴물이 있다고 상상해 보라는 요청을 받았다."}], "others": [["❶", "that", "know의 목적어 + 뒤가 완전한 문장 → 접속사 that"], ["❷", "refuse", "사역동사 make + 목적어 + 동사원형"], ["❸", "displaying", "have a difficult time (in) -ing → 동명사"], ["❺", "when", "뒤가 완전한 절 → '~할 때' 접속사"]], "note": "※ show, give, teach 같은 4형식 동사는 수동태여도 목적어가 하나 남는다 → '목적어가 있으니 능동'이라는 착각 주의. 주어가 '보여 주는' 쪽인지 '보는' 쪽인지로 판단", "summary": ""}}, {"no": 7, "src": "3월 31번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Research shows <span class=\"opt\" data-k=\"1\"><span class=\"mk\">①<\/span><u>that,<\/u><\/span> by age three, children understand that imaginary objects do not come to life. This is especially clear with respect to everyday objects: children know that even though they     <span class=\"opt\" data-k=\"2\"><span class=\"mk\">②<\/span><u>imagine<\/u><\/span> a pencil in an empty box, the box will remain empty. However, emotion can sometimes disrupt this understanding, or at least its expression. That is, even though a child knows that monsters are not real, the thought of a monster under a bed might be enough to make a child refuse to go into his room at night. Indeed, research <span class=\"opt\" data-k=\"3\"><span class=\"mk\">③<\/span><u>showing<\/u><\/span> that children have a more difficult time displaying their understanding of the causal relations between imagination and reality when they are asked to pretend or imagine scary things, like monsters. In one study, preschool children <span class=\"opt\" data-k=\"4\"><span class=\"mk\">④<\/span><u>were shown<\/u><\/span> an empty box and were asked to imagine a monster inside. All children agreed that the box was empty. However, when they were left alone with the box they exhibited fear and <span class=\"opt\" data-k=\"5\"><span class=\"mk\">⑤<\/span><u>avoidance<\/u><\/span> of it."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "③", "fix": "showing → shows", "tag": "동사 vs 준동사", "lines": ["Indeed, research [showing → shows] that children have a more difficult time displaying ~", "→ research(주어) 뒤에 research의 동사가 없다 (have는 that절 안의 동사)", "→ -ing형은 혼자 동사가 될 수 없으므로 <b>동사<\/b> 필요. research는 셀 수 없는 명사 → 단수 shows"], "ko": "실제로 연구에 따르면, 아이들은 괴물처럼 무서운 것을 상상하라는 요청을 받을 때 상상과 현실의 인과 관계에 대한 이해를 드러내는 데 더 어려움을 겪는다."}], "others": [["①", "that,", "shows의 목적어 + 뒤가 완전한 문장 → 접속사 that"], ["②", "imagine", "even though절 주어 they(복수) → imagine"], ["④", "were shown", "아이들이 상자를 '보게 된' 것 → 4형식 수동태"], ["⑤", "avoidance", "fear and avoidance → 명사끼리 병렬"]], "note": "※ 같은 지문에서 shows, were shown처럼 위치를 바꿔 가며 '동사 자리'를 출제 → 문장마다 주어와 그 주어의 동사를 짝지어 볼 것", "summary": ""}}, {"no": 8, "src": "3월 32번", "stem": "<b>다음 밑줄 부분 중, 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Perhaps the best-known development to emerge from the liberation and expansion of aesthetic experience is the aesthetics of everyday life. Although there <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>are<\/u><\/span> presently many studies on everyday aesthetics, the possibility of aesthetic gratification in ordinary objects and events <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>has<\/u><\/span> long been recognized, even if degraded and dismissed by prevalent philosophical theory. Widely valued by poets, especially Romantic poets and those in Asian traditions, the aesthetic in everyday situations has also been recognized by novelists. It may be most convenient, though, to locate its contemporary intellectual origins in John Dewey’s Art as Experience. In that book Dewey argued against the separation of art from life by <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>basing<\/u><\/span> aesthetic experience on the biological and cultural conditions of human life. He located the aesthetic, not in an internalized awareness of sensation and feeling but in “a complete interpenetration of self and the world of objects and events.” Further, Dewey maintained <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>which<\/u><\/span> “the aesthetic is the clarified and intensified development of traits <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>belonging<\/u><\/span> to every normally complete experience.”"], "notes": [], "bogi": null, "ch": null, "ans": [4], "ex": {"core": [{"key": "❹", "fix": "which → that", "tag": "관계대명사 which vs 접속사 that", "lines": ["Further, Dewey maintained [which → that] “the aesthetic is the clarified and intensified development of traits (belonging to every normally complete experience).”", "→ maintained의 목적어 자리 → 명사절이 필요하다.", "→ the aesthetic(주어) + is(동사) + the ~ development(보어) → 뒷문장이 완전 + 선행사도 없음", "→ 관계대명사 which는 불가 → 명사절 접속사 that"], "ko": "더 나아가 듀이는 '미적인 것은 정상적으로 완결된 모든 경험에 속하는 특성들이 명료해지고 강화되어 발달한 것'이라고 주장했다."}], "others": [["❶", "are", "there are + 실제 주어 many studies(복수)"], ["❷", "has", "주어 the possibility(단수) → has been recognized"], ["❸", "basing", "전치사 by 뒤 + 목적어 있음 → 동명사"], ["❺", "belonging", "belong은 자동사 → 능동의 현재분사"]], "note": "※ which vs that → ① 앞에 선행사가 있는가 ② 뒷문장이 완전한가<br>※ say, argue, maintain, believe 바로 뒤에 완전한 문장 → 접속사 that", "summary": ""}}, {"no": 9, "src": "3월 33번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["One cannot validly argue that humans are morally superior beings on the ground that they possess, while others lack, the capacities of a moral agent. The reason is that, as far as moral standards are concerned, only beings <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>that<\/u><\/span> have the capacities of a moral agent can meaningfully be said to be either morally good or morally bad. Only moral agents can be judged to be morally better or worse than others, and the others in question must be moral agents in <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>itself<\/u><\/span>. Judgments of moral superiority are based on the comparative merits or deficiencies of the entities being judged, and those are all moral ones, that is, ones <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>determined<\/u><\/span> by moral standards. One entity is correctly judged morally superior to another if it is the case that, when valid moral standards <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>being applied<\/u><\/span> to both entities, the first fulfills them to a greater degree than the second. Both entities, therefore, must fall within the range of application of moral standards. This would not be the case, however, if humans were judged superior to animals and plants, since the latter <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>are<\/u><\/span> not moral agents."], "notes": [], "bogi": null, "ch": null, "ans": [2, 4], "ex": {"core": [{"key": "❷", "fix": "itself → themselves", "tag": "재귀대명사 수일치", "lines": ["~ and the others (in question) must be moral agents in [itself → themselves].", "→ 재귀대명사는 가리키는 명사와 수일치!", "→ 가리키는 것은 the others(<b>복수<\/b>) → themselves", "※ in themselves: 그 자체로"], "ko": "그리고 문제의 그 다른 존재들도 그 자체로 도덕적 행위자여야 한다."}, {"key": "❹", "fix": "being applied → are applied", "tag": "동사 vs 준동사", "lines": ["~ when valid moral standards [being applied → are applied] (to both entities), the first fulfills them ~", "→ when은 접속사 → 뒤에 주어 + 동사 필요. 주어 valid moral standards는 있는데 동사가 없다", "→ 기준이 '적용되는' 수동 + 복수 주어 → <b>are applied<\/b>"], "ko": "타당한 도덕적 기준이 두 존재 모두에게 적용될 때"}], "others": [["❶", "that", "뒤에 주어가 빠진 불완전한 문장 → 주격 관대"], ["❸", "determined", "특성들이 기준에 의해 '결정되는' 것 → p.p."], ["❺", "are", "the latter = animals and plants(복수) → are"]], "note": "※ 재귀대명사는 가리키는 명사의 수를, 접속사 when / if / because 뒤에는 동사가 있는지를 확인 → 두 곳을 모두 찾아 고치는 서술형으로도 출제", "summary": ""}}, {"no": 10, "src": "3월 33번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["One cannot validly argue that humans are morally superior beings on the ground that they possess, while others lack, the capacities of a moral agent. The reason is that, as far as moral standards are concerned, only beings <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>which<\/u><\/span> have the capacities of a moral agent can meaningfully be said to be either morally good or morally bad. Only moral agents can be judged to be morally better or worse than others, and the others in question must be moral agents <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>themselves<\/u><\/span>. Judgments of moral superiority <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>is<\/u><\/span> based on the comparative merits or deficiencies of the entities being judged, and these merits and deficiencies are all moral ones, that is, ones determined by moral standards. One entity is correctly judged morally superior to another if it is the case that, when valid moral standards are applied to both, the first fulfills <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>them<\/u><\/span> to a greater degree than the second. Both <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>entities<\/u><\/span>, therefore, must fall within the range of application of moral standards. This would not be the case, however, if humans were being judged superior to animals and plants, since the latter are not moral agents."], "notes": ["*entity: 존재"], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "❸", "fix": "is → are", "tag": "주어-동사 수일치", "lines": ["Judgments (of moral superiority) [is → are] based on the comparative merits or deficiencies (of the entities being judged), ~", "→ 전명구 of moral superiority 묶고 없는 셈 치기! 남는 주어는 <b>Judgments(복수)<\/b>", "→ 동사 바로 앞 superiority(단수)에 속지 말 것 → are", "※ be based on: ~에 근거하다"], "ko": "도덕적 우월성에 대한 판단은 판단 대상이 되는 존재들의 상대적인 장점이나 결점에 근거한다."}], "others": [["❶", "which", "뒤에 주어가 빠진 불완전한 문장 → 주격 관대"], ["❷", "themselves", "the others(복수)를 강조하는 재귀대명사"], ["❹", "them", "valid moral standards(복수)를 받는 대명사"], ["❺", "entities", "Both 뒤 → 복수 명사"]], "note": "※ 수일치에서 지울 수식어: ① 쉼표-쉼표 삽입 ② 관계사절 ③ to부정사 부사적 용법 ④ 전명구 ⑤ 부사(절) → 묶고 나서 핵심 주어를 찾는다.", "summary": ""}}, {"no": 11, "src": "3월 33번", "stem": "<b>다음 글의 밑줄 친 부분 ①~⑤ 중 어법상 <u>어색한 <\/u>것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["One cannot validly argue that humans are <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>morally<\/u><\/span> superior beings on the ground that they possess, while others lack, the capacities of a moral agent. The reason is that, as far as moral standards are concerned, only beings that have the capacities of a moral agent can meaningfully be said to be either morally good or morally bad. Only moral agents can be judged to be morally better or worse than others, and the others in question must be moral agents <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>themselves<\/u><\/span>. Judgments of moral superiority <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>is<\/u><\/span> based on the comparative merits or deficiencies of the entities being judged, and these merits and deficiencies are all moral ones, that is, ones <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>determined<\/u><\/span> by moral standards. One entity is correctly judged morally superior to another if it is the case that, when valid moral standards are applied to both entities, the first fulfills <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>them<\/u><\/span> to a greater degree than the second. Both entities, therefore, must fall within the range of application of moral standards. This would not be the case, however, if humans were judged superior to animals and plants, since the latter are not moral agents."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "❸", "fix": "is → are", "tag": "주어-동사 수일치", "lines": ["Judgments (of moral superiority) [is → are] based on the comparative merits or deficiencies (of the entities being judged), ~", "→ 전명구 묶고 없는 셈 치기! 남는 주어는 <b>Judgments(복수)<\/b>.", "→ 동사 바로 앞 superiority(단수)에 속지 말 것 → 복수 동사 are."], "ko": "도덕적 우월성에 대한 판단은 판단 대상이 되는 존재들의 상대적인 장점이나 결점에 근거한다."}], "others": [["❶", "morally", "형용사 superior 수식 → 부사 morally"], ["❷", "themselves", "주어 the others(복수)를 강조하는 재귀대명사 → themselves"], ["❹", "determined", "ones가 기준에 의해 '결정되는' 것 → p.p."], ["❺", "them", "valid moral standards(복수) → them"]], "note": "※ 주어와 동사 사이의 전명구·분사구·관계사절은 묶고 지운다 → 맨 앞 핵심 명사에 수일치", "summary": ""}}, {"no": 12, "src": "3월 34번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Such artificial ‘pause fillers’ as machine-generated supplements for silence may help to produce a more natural-sounding cadence in machine-generated speech patterns and so help to convince the AI’s human interlocutors <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>that<\/u><\/span> they are engaging with another human. AI’s ‘humanity’ of silence emerges in these contexts not least because a short period of silence is likely to be interpreted as a ‘pause for thought’, therefore <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>reinforcing<\/u><\/span> the illusion that the machine is ‘thinking’ before responding, just as a human might. However, the technical issues <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>flagged<\/u><\/span> in AI’s poor handling of higher duration and frequency silences, no less than the machine inference that silence can be filled with relevant sounds in some conversational situations, are both significant. In this context at least, the AI may be starting to <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>recognise<\/u><\/span> silence not as an absence but as meaningful data. Yet the AI’s confusion when presented with substantial silences, and its understanding that short break tags are equivalent to vocal markers such as ‘uh’s’ and ‘ah’s’ <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>indicates<\/u><\/span> the AI’s continuing preferences for sound over silence, for presence over absence."], "notes": [], "bogi": null, "ch": null, "ans": [5], "ex": {"core": [{"key": "❺", "fix": "indicates → indicate", "tag": "A and B 주어 수일치", "lines": ["Yet the AI’s confusion (when presented with substantial silences), and its understanding (that short break tags are equivalent to vocal markers such as ‘uh’s’ and ‘ah’s’) [indicates → indicate] the AI’s continuing preferences ~", "→ 수식어를 묶으면 남는 주어: the AI’s confusion <b>and<\/b> its understanding", "→ 각각 단수처럼 보여도 A and B가 주어 → 복수 동사 <b>indicate<\/b>!"], "ko": "그러나 상당한 침묵이 주어졌을 때 AI가 보이는 혼란, 그리고 짧은 휴지 태그가 ‘어’, ‘아’ 같은 음성 표지와 같다는 AI의 이해는 AI가 여전히 침묵보다 소리를, 부재보다 존재를 선호한다는 것을 보여 준다."}], "others": [["❶", "that", "convince + O + 완전한 문장 → 접속사 that"], ["❷", "reinforcing", "뒤에 목적어 the illusion → 능동 분사구문"], ["❸", "flagged", "문제들이 '지적된' 것 → 수동의 p.p."], ["❹", "recognise", "start to + 동사원형 (영국식 철자)"]], "note": "※ 긴 수식어를 단 주어 두 개가 and로 연결되면 수일치 함정 → 수식어 지우고 A and B + 복수 동사", "summary": ""}}, {"no": 13, "src": "3월 37번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>적절한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["If you are going to compare languages, it helps to start with something <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>what<\/u><\/span> you are confident you can find in all languages. Take for example signs or words for mother and father. If we add other family relationships to this category – son, grandmother, aunt, brother-in-law, cousin – we are <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>defined<\/u><\/span> the category of kinship terminology. Comparative typological studies of kinship terminology <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>have discovered<\/u><\/span> that languages have labels for some but not all family relationships. And the probability <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>which<\/u><\/span> a specific kin relationship has a label is predictable based on the other kinship terms in the language. For example, all languages have a core set of kinship terms – like mother and father. By contrast, terms for less central category members are often built up from the core terms – like mother-in-law and step-father. If we compare languages across the world, we can ask <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>that<\/u><\/span> kinship relationships are typically expressed with core terminology, and what relationships are expressed by modifying the core terminology."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "❸", "fix": "have discovered (옳음)", "tag": "주어-동사 수일치", "lines": ["Comparative typological studies (of kinship terminology) [have discovered] that languages have labels ~", "→ 전명구 묶으면 주어는 <b>studies(복수)<\/b> → 복수 동사 have.", "→ 연구들이 '발견한' 것 + 뒤에 목적어(that절) → 능동의 현재완료."], "ko": "친족 용어에 대한 비교 유형론 연구들은 언어들이 모든 가족 관계가 아니라 일부 가족 관계에만 명칭을 가지고 있다는 것을 발견했다."}], "others": [["❶", "what", "what → that: 선행사 something + 불완전"], ["❷", "defined", "are defined → have defined: 목적어 있음 → 능동"], ["❹", "which", "which → that: 뒤가 완전 → 동격의 that"], ["❺", "that", "that → what: '어떤' 친족 관계인지 → 의문사 what"]], "note": "※ 동격의 that vs 관계대명사 which: the fact / the probability / the idea + that + 완전한 문장", "summary": ""}}, {"no": 14, "src": "3월 38번", "stem": "<b>다음 글의 밑줄 친 ①~⑤ 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["There are several ways <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>that<\/u><\/span> participants in a make-believe can communicate things about the fictional world to other participants. Sometimes these messages are emitted naturally as a result of full participation in the fictional world – i.e., something said or done by a player while in character communicates some things that are fictional of that world. For example, a child <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>pretending<\/u><\/span> to be Peter Pan might gasp and draw a plastic knife. This might be sufficient to communicate that fictionally one of Peter&#x27;s enemies, such as Captain Hook, <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>is<\/u><\/span> approaching. These in-character behaviors can be insufficient, however, to maintain the necessary amount of common ground about <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>that<\/u><\/span> is fictional in the world of the make-believe. At these times participants often come at least partly out of character to give other participants the information they need. For example, it would be important <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>to avoid<\/u><\/span> confusion about who is playing which character: &quot;<u>No, you&#x27;re Captain Hook, and I&#x27;m Peter Pan!<\/u>&quot;"], "notes": ["*make-believe: 가상 역할 놀이 **gasp: 숨을 헐떡이다"], "bogi": null, "ch": null, "ans": [4], "ex": {"core": [{"key": "❹", "fix": "that → what", "tag": "명사절 that vs 명사절 what", "lines": ["~ common ground about [that → what] is fictional (in the world of the make-believe).", "→ 전명구 묶으면 ___ is fictional: is의 주어가 빠진 <b>불완전한 문장<\/b>.", "→ 선행사도 없고 뒤가 불완전 → 선행사를 품은 관계대명사 <b>what<\/b>('~인 것')!", "→ 접속사 that은 뒷문장이 완전해야 하고, 전치사 바로 뒤에도 못 온다."], "ko": "그러나 이러한 역할 속 행동들은 가상 역할 놀이의 세계에서 무엇이 허구인지에 대한 필요한 만큼의 공통 기반을 유지하기에는 불충분할 수 있다."}], "others": [["❶", "that", "ways + 뒤가 완전 → 관계부사 대신 쓴 that"], ["❷", "pretending", "아이가 '~인 척하는' 것 → 능동의 -ing"], ["❸", "is", "주어 one (of Peter's enemies) 단수 → is"], ["❺", "to avoid", "가주어 it - 진주어 to부정사"]], "note": "※ 전치사 뒤에는 접속사 that 불가(in that, except that 제외) → 전치사 뒤 + 불완전한 문장이면 what", "summary": ""}}, {"no": 15, "src": "3월 38번", "stem": "<b>다음 글의 밑줄 친 ①~⑤ 중 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["There are several ways <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>that<\/u><\/span> participants in a make-believe can communicate things about the fictional world to other participants. Sometimes these messages are emitted naturally as a result of full participation in the fictional world - i.e., something said or done by a player while in character communicates some things that are fictional of that world. For example, a child <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>pretending<\/u><\/span> to be Peter Pan might gasp and draw a plastic knife. This might be sufficient to communicate that fictionally one of Peter&#x27;s enemies, such as Captain Hook, <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>is<\/u><\/span> approaching. These in-character behaviors can be insufficient, however, to maintain the necessary amount of common ground about <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>that<\/u><\/span> is fictional in the world of the make-believe. At these times participants often come at least partly out of character to give other participants the information they need. For example, it would be important <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>to avoid<\/u><\/span> confusion about who is playing which character: &quot;<u>No, you&#x27;re Captain Hook, and I&#x27;m Peter Pan!<\/u>&quot;"], "notes": ["*make-believe: 가상 역할 놀이 **gasp: 숨을 헐떡이다"], "bogi": null, "ch": null, "ans": [4], "ex": {"core": [{"key": "❹", "fix": "that → what", "tag": "명사절 that vs 명사절 what", "lines": ["~ common ground about [that → what] is fictional (in the world of the make-believe).", "→ 전명구 묶으면 ___ is fictional: is의 주어가 빠진 <b>불완전한 문장<\/b>.", "→ 선행사도 없고 뒤가 불완전 → 선행사를 품은 관계대명사 <b>what<\/b>('~인 것')!", "→ 접속사 that은 뒷문장이 완전해야 하고, 전치사 바로 뒤에도 못 온다."], "ko": "그러나 이러한 역할 속 행동들은 가상 역할 놀이의 세계에서 무엇이 허구인지에 대한 필요한 만큼의 공통 기반을 유지하기에는 불충분할 수 있다."}], "others": [["❶", "that", "ways + 뒤가 완전 → 관계부사 대신 쓴 that"], ["❷", "pretending", "아이가 '~인 척하는' 것 → 능동의 -ing"], ["❸", "is", "주어 one (of Peter's enemies) 단수 → is"], ["❺", "to avoid", "가주어 it - 진주어 to부정사"]], "note": "※ 전치사 뒤에는 접속사 that 불가(in that, except that 제외) → 전치사 뒤 + 불완전한 문장이면 what", "summary": ""}}, {"no": 16, "src": "3월 39번", "stem": "<b>다음 글의 밑줄 친 부분 중 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Our intuition about states of matter comes from our experience on Earth&#x27;s surface, <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>where<\/u><\/span> the pressure is uniformly low and variations in temperature cause changes in the state of matter from solid to liquid to gas. Therefore, when we think of melting or boiling or the creation of plasma, we <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>intuitively<\/u><\/span> assume it reflects an increase in temperature. This bias comes from the fact <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>that<\/u><\/span> we live in a very constant pressure environment. Even small changes in pressure, such as <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>that<\/u><\/span> we experience when under water or on high mountaintops, can have very large effects on our metabolism. But the pressure changes we experience are trivial compared to the pressure range of the overall planetary environment. Since pressure is controlled by the weight of overlying material, pressures increase rapidly with depth. Imagine the pressures <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>generated<\/u><\/span> by the weight of rock a mile thick! For this reason a planet&#x27;s pressure ranges are enormous - from essentially zero pressure in space to pressures of millions of atmospheres in planetary interiors."], "notes": ["*intuition: 직관", "**metabolism: 신진대사"], "bogi": null, "ch": null, "ans": [4], "ex": {"core": [{"key": "❹", "fix": "that → those", "tag": "지시대명사 that vs those", "lines": ["Even small changes (in pressure), such as [that → those] (we experience when under water or on high mountaintops), can have very large effects ~", "→ 앞의 명사를 다시 받는 대명사 자리. 가리키는 것은 <b>changes(복수)<\/b> → those.", "→ we experience ~는 목적격 관계사가 생략된 관계사절 → those (that) we experience"], "ko": "물속이나 높은 산꼭대기에서 우리가 겪는 것과 같은 작은 압력 변화조차도 우리의 신진대사에 매우 큰 영향을 미칠 수 있다."}], "others": [["❶", "where", "Earth's surface + 뒤가 완전 → 관계부사 where"], ["❷", "intuitively", "동사 assume 수식 → 부사"], ["❸", "that", "뒤가 완전 → the fact와 동격의 that"], ["❺", "generated", "압력이 '생성되는' 것 → 수동의 p.p."]], "note": "※ 단수 명사 반복은 that, 복수 명사 반복은 those (비교구문 than that of / than those of 단골)", "summary": ""}}, {"no": 17, "src": "3월 40번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것을 모두 고른 것은?<\/b>", "kind": "list", "sym": "①", "n": 5, "p": ["<span class=\"mk\">ⓐ<\/span><u>When<\/u> self-experimentation and conventional experiments are both possible, the difference between them often resembles the difference between learning and showing: Self-experiments are better for discovery but worse for convincing others <span class=\"mk\">ⓑ<\/span><u>what<\/u> the solution is helpful or the answer is correct. Of course, most scientists want to do both – discover something and convince others of their discovery. Thus, psychologists should consider doing both self-experiments and conventional ones. The best use of resources may often be self-experiments followed by conventional ones. The researcher begins with self-experiments <span class=\"mk\">ⓒ<\/span><u>that<\/u>, if all goes well, find large effects and / or generate and eliminate many hypotheses. This exploratory and theory-building phase lasts until a convenient solution or large effect <span class=\"mk\">ⓓ<\/span><u>is found<\/u>. Then the researcher uses self-experiments <span class=\"mk\">ⓔ<\/span><u>to find<\/u> the procedural parameters that optimize the solution or maximize the effect. Only then would the researcher begin conventional experiments, <span class=\"mk\">ⓕ<\/span><u>used<\/u> the optimized parameters."], "notes": [], "bogi": null, "ch": {"items": ["ⓐ, ⓑ", "ⓑ, ⓒ", "ⓒ, ⓕ", "ⓓ, ⓔ", "ⓑ, ⓕ"]}, "ans": [5], "ex": {"core": [{"key": "ⓐ", "fix": "When (적절함)", "tag": "부사절 접속사", "lines": ["[When] self-experimentation and conventional experiments are both possible, the difference (between them) often resembles ~", "→ 뒤에 주어 + 동사(are)가 있는 완전한 절 → '~할 때' 접속사 When."], "ko": "자기 실험과 일반적인 실험이 둘 다 가능할 때, 그 둘의 차이는 흔히 배우는 것과 보여 주는 것의 차이와 비슷하다."}, {"key": "ⓑ", "fix": "what → that (어색함)", "tag": "명사절 that vs 명사절 what", "lines": ["~ worse for convincing others [what → that] the solution is helpful or the answer is correct.", "→ the solution(주어) + is(동사) + helpful(보어): 뒷문장이 <b>완전<\/b> → 접속사 that.", "→ convince + 목적어 + that절: '~에게 …라고 설득하다'"], "ko": "자기 실험은 발견에는 더 낫지만, 해결책이 도움이 된다거나 답이 옳다고 다른 사람들을 설득하는 데는 더 못하다."}, {"key": "ⓒ", "fix": "that (적절함)", "tag": "주격 관계대명사", "lines": ["~ self-experiments [that], (if all goes well,) find large effects and / or generate and eliminate many hypotheses.", "→ 쉼표-쉼표 삽입 묶고 없는 셈 치기! that find ~: find의 주어가 빠진 불완전한 문장 → 주격 관계대명사.", "→ 선행사 self-experiments(복수) → 동사도 find(복수)."], "ko": "연구자는 모든 것이 잘되면 큰 효과를 발견하거나 많은 가설을 만들고 제거하는 자기 실험으로 시작한다."}, {"key": "ⓓ", "fix": "is found (적절함)", "tag": "능동태 vs 수동태", "lines": ["~ until a convenient solution or large effect [is found].", "→ 해결책·효과는 '발견되는' 것 → 수동태.", "→ A or B 주어는 B에 수일치 → large effect(단수) → is."], "ko": "이 탐색적이고 이론을 세우는 단계는 편리한 해결책이나 큰 효과가 발견될 때까지 계속된다."}, {"key": "ⓔ", "fix": "to find (적절함)", "tag": "동사 vs 준동사", "lines": ["Then the researcher uses self-experiments [to find] the procedural parameters (that optimize the solution or maximize the effect).", "→ 동사 uses가 이미 있다 → 동사 자리가 아니다.", "→ '~을 찾기 위해' 목적의 to부정사(부사적 용법)."], "ko": "그런 다음 연구자는 해결책을 최적화하거나 효과를 극대화하는 절차상의 변수들을 찾기 위해 자기 실험을 사용한다."}, {"key": "ⓕ", "fix": "used → using (어색함)", "tag": "현재분사 vs 과거분사", "lines": ["Only then would the researcher begin conventional experiments, [used → using] the optimized parameters.", "→ 분사구문의 주어 = 주절 주어 the researcher.", "→ 연구자가 '사용하는' 것 + 뒤에 목적어 the optimized parameters → 능동의 -ing. 수동 used로는 '변수를 사용하는' 뜻이 안 된다."], "ko": "그때가 되어서야 비로소 연구자는 최적화된 변수를 사용하여 일반적인 실험을 시작할 것이다."}], "others": [], "note": "※ Only then + 조동사 + 주어 어순 도치(would the researcher begin)도 출제 포인트", "summary": "→ 어색한 것 ⓑ, ⓕ : ⑤"}}, {"no": 18, "src": "3월", "stem": "<b>다음 밑줄 친 부분 중에서 어법상 <u>틀린<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["In a thesis-based doctoral programme, students typically spend a significant amount of time and effort researching a specific topic. While this deep dive into a particular area <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>allows<\/u><\/span> for thorough exploration and understanding, it can also result in narrowing the focus. As students become deeply <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>absorbed<\/u><\/span> in their research, they may spend less time exploring related fields or acquiring skills outside their immediate area of study. Consequently, this singular focus may limit the breadth of knowledge and skills <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>developed<\/u><\/span> during the programme, potentially hindering students’ ability to adapt to diverse career paths or address interdisciplinary challenges. The limitations of traditional thesis-based doctoral programmes <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>have been recognized<\/u><\/span> by some universities so they have started to implement more structured approaches. These structured programmes often combine research with coursework and training in transferable skills. While <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>incorporated<\/u><\/span> coursework, seminars, workshops and internships into the curriculum, they aim to provide students with a broader skill set and better prepare them for a variety of career paths beyond academia."], "notes": [], "bogi": null, "ch": null, "ans": [5], "ex": {"core": [{"key": "❺", "fix": "incorporated → incorporating", "tag": "현재분사 vs 과거분사", "lines": ["While [incorporated → incorporating] coursework, seminars, workshops and internships (into the curriculum), they aim to provide ~", "→ 접속사를 남긴 분사구문. 생략된 주어 = 주절 주어 <b>they<\/b>(= 구조화된 프로그램들)", "→ 프로그램이 '포함시키는' 것 + 뒤에 목적어(coursework ~) → 능동의 -ing!", "incorporate A into B: A를 B에 포함시키다"], "ko": "수업, 세미나, 워크숍, 인턴십을 교육과정에 포함시키면서, 그 프로그램들은 학생들에게 더 폭넓은 기술을 제공하고 학계를 넘어선 다양한 진로에 더 잘 대비시키는 것을 목표로 한다."}], "others": [["❶", "allows", "주어 this deep dive(단수) → allows"], ["❷", "absorbed", "become absorbed in: '~에 몰두하다'"], ["❸", "developed", "지식·기술이 '개발되는' 것 → p.p."], ["❹", "have been recognized", "limitations(복수) + '인정되어 온' → 완료 수동"]], "note": "※ 접속사(While/When/Though) + 분사구문: 뒤에 목적어 있으면 -ing, 없으면 p.p.", "summary": ""}}, {"no": 19, "src": "6월 21번", "stem": "<b>다음 글의 밑줄 친 부분 중 어법상 적절한 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Humans excel at visual imagery. Our brains evolved this ability to create an internal mental picture or model of the world <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>which<\/u><\/span> we can rehearse forthcoming actions, without the risks or the penalties of doing them in the real world. There <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>is<\/u><\/span> even hints from brain-imaging studies by Harvard University psychologist Steve Kosslyn showing that your brain uses the same regions to imagine a scene as when you actually view <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>ones<\/u><\/span>. But evolution has seen to it that such internally generated representations are never as authentic as the real thing. This is a wise bit of self-restraint on your genes&#x27; part. If your internal model of the world <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>were<\/u><\/span> a perfect substitute, then anytime you felt hungry you could simply imagine yourself at a banquet, consuming a feast. You would have no incentive to find real food and <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>to starve<\/u><\/span> to death. As the Bard said, &quot;You cannot cloy the hungry edge of appetite by bare imagination of a feast.&quot;"], "notes": [], "bogi": null, "ch": null, "ans": [4], "ex": {"core": [{"key": "❹", "fix": "were (옳음)", "tag": "가정법 과거", "lines": ["If your internal model (of the world) [were] a perfect substitute, then (anytime you felt hungry) you could simply imagine yourself ~", "→ 주절이 could + 동사원형 → 현재 사실의 반대, <b>가정법 과거<\/b>.", "→ 가정법 과거 If절의 be동사는 주어가 단수여도 were.", "If + 주어 + were ~, 주어 + could + 동사원형"], "ko": "만약 세상에 대한 여러분의 내적 모델이 완벽한 대체물이라면, 배고플 때마다 여러분은 그저 연회에서 잔치 음식을 먹고 있는 자신을 상상하기만 하면 될 것이다."}], "others": [["❶", "which", "which → in which/where: 뒤가 완전"], ["❷", "is", "is → are: There + be + 주어 hints(복수)"], ["❸", "ones", "ones → one: a scene(단수)을 받음"], ["❺", "to starve", "to starve → starve: would have와 병렬"]], "note": "※ 주절 조동사로 판단: could + 동사원형 → 가정법 과거 / could have p.p. → 가정법 과거완료", "summary": ""}}, {"no": 20, "src": "6월 21번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Humans <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>excel at<\/u><\/span> visual imagery. Our brains evolved this ability to create an internal mental picture or model of the world <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>where<\/u><\/span> we can rehearse forthcoming actions, without the risks or the penalties of doing them in the real world. There are even hints from brain-imaging studies by Harvard University psychologist Steve Kosslyn <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>shows<\/u><\/span> that your brain uses the same regions to imagine a scene as it does when you actually view one. But evolution <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>has seen to it<\/u><\/span> that such internally generated representations are never as authentic as the real thing. This is a wise bit of self-restraint on your genes&#x27; part. <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>Were<\/u><\/span> your internal model of the world a perfect substitute, then anytime you felt hungry you could simply imagine yourself at a banquet, consuming a feast. You would have no incentive to find real food and would soon starve to death. As the Bard said, &quot;You cannot cloy the hungry edge of appetite by bare imagination of a feast.&quot;"], "notes": [], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "❸", "fix": "shows → showing", "tag": "동사 vs 준동사", "lines": ["There are even hints (from brain-imaging studies by Harvard University psychologist Steve Kosslyn) [shows → showing] that your brain uses ~", "→ 전명구 묶고 없는 셈 치기! 동사 <b>are<\/b>가 이미 있고 접속사도 없다 → 동사 shows 불가.", "→ hints가 '보여 주는' 것 + 뒤에 목적어(that절) → 능동의 -ing (= that show)."], "ko": "심지어 하버드 대학 심리학자 Steve Kosslyn의 뇌 영상 연구에서 나온, 여러분의 뇌가 장면을 상상할 때 실제로 장면을 볼 때와 같은 영역을 사용한다는 것을 보여 주는 단서들도 있다."}], "others": [["❶", "excel at", "excel at: '~에 뛰어나다', 주어 Humans(복수)"], ["❷", "where", "뒤가 완전 → 관계부사 where"], ["❹", "has seen to it", "see to it that: '~하도록 조치하다'"], ["❺", "Were", "If 생략 → Were + 주어 도치 가정법"]], "note": "※ Were / Had / Should + 주어 ~로 시작하면 If가 생략된 도치 가정법", "summary": ""}}, {"no": 21, "src": "6월 22번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["For each objective probability – from one percent to 100 percent – we want to know the subjective probability weight. When we make decisions, do we treat a one-percent chance just like one percent, or like something else? Events that could <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>happen<\/u><\/span> but aren&#x27;t likely – low-probability events – can be defined as probabilities up to about 25 percent. Low-probability events tend to factor more into decisions than they <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>are<\/u><\/span>. That is, an event that <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>has<\/u><\/span> an objective one-percent chance of occurring could subjectively seem like it has a five-percent chance of occurring. We overestimate the likelihood of these low-probability events. In general, the smaller the probability, the more we overestimate <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>its<\/u><\/span> likelihood. For example, people <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>playing<\/u><\/span> the lottery are often optimistic about winning. However, the odds of a single ticket winning the largest, most popular U.S. lotteries are on the order of one in 175 million."], "notes": [], "bogi": null, "ch": null, "ans": [2], "ex": {"core": [{"key": "❷", "fix": "are → should (일반동사 factor를 대신)", "tag": "대동사 be vs do/조동사", "lines": ["Low-probability events tend to factor more (into decisions) than they [are → should].", "→ than 뒤 빈자리는 앞의 동사 <b>factor<\/b>를 대신하는 대동사 자리다.", "→ factor는 '요인으로 작용하다'라는 <b>일반동사<\/b> → be동사 are로 받을 수 없다. do/does/did 또는 조동사(should)로 받는다.", "than they should (factor) = '마땅히 그래야 하는 것보다'"], "ko": "낮은 확률의 사건들은 마땅히 그래야 하는 것보다 더 많이 결정에 영향을 미치는 경향이 있다."}], "others": [["❶", "happen", "조동사 could 뒤 → 동사원형"], ["❸", "has", "선행사 an event(단수) → 단수 동사 has"], ["❹", "its", "the probability(단수)를 가리킴 → its"], ["❺", "playing", "사람들이 복권을 '하는' 것 → 능동의 -ing"]], "note": "※ 대동사: 앞 동사가 일반동사면 do/does/did(또는 조동사), be동사면 be동사로 받는다.", "summary": ""}}, {"no": 22, "src": "6월 23번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Many of the barriers to trade exist not because of a lack of markets or customers, but because there are major barriers to <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>getting<\/u><\/span> products to market at competitive prices. Transaction costs are significant for companies ─ not only the straight exchange costs, but also the cost of converting, paying, and hedging funds just to pay for the goods and services. Having a common currency <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>means<\/u><\/span> that many of those transaction costs disappear and the savings can <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>be reinvested<\/u><\/span> back into firms&#x27; productivity and innovation. Basically, useless costs turn into productive costs ─ with longer-term benefits to the whole economy. By <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>unifying<\/u><\/span> some of the currencies, whole economies benefit and grow more than they <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>are<\/u><\/span> as independents. So a common currency provides for a strong economic foundation that all can benefit from."], "notes": [], "bogi": null, "ch": null, "ans": [5], "ex": {"core": [{"key": "❺", "fix": "are → do", "tag": "대동사 be vs do", "lines": ["(By unifying some of the currencies), whole economies benefit and grow more than they [are → do] (as independents).", "→ 전명구 묶고 없는 셈 치기! 남는 것은 whole economies(주어) + benefit and grow(동사).", "→ than 뒤는 앞의 <b>일반동사<\/b> benefit and grow를 대신하는 자리 → be동사가 아니라 대동사 <b>do<\/b>.", "→ 주어 they(= whole economies) 복수 + 현재시제 → do"], "ko": "일부 통화를 통합함으로써, 경제 전체가 독립적일 때보다 더 많은 이익을 얻고 더 성장한다."}], "others": [["❶", "getting", "barriers to의 to는 전치사 → 동명사"], ["❷", "means", "동명사 주어 Having ~ → 단수 취급"], ["❸", "be reinvested", "돈이 '재투자되는' 것 → 수동태"], ["❹", "unifying", "전치사 By 뒤 + 목적어 있음 → 능동 동명사"]], "note": "※ 대동사는 시제·수까지 맞춘다: 과거면 did, 3인칭 단수 현재면 does.", "summary": ""}}, {"no": 23, "src": "6월 29번", "stem": "<b>다음 글의 밑줄 친 부분 중 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["The renowned British philosopher Alfred North Whitehead asserted that &quot;civilization advances by extending the number of operations we can perform without thinking about <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>them<\/u><\/span>.&quot; Take, for example, the &quot;advance&quot; offered to civilization by the discount coupon, which <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>allows<\/u><\/span> consumers to assume that they will receive a reduced purchase price by presenting the coupon. The extent to which we have learned to operate mechanically on that assumption is illustrated in the experience of one automobile-tire company. Mailed out coupons that - because of a printing error - offered no savings to recipients produced just as much customer response as <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>were<\/u><\/span> error-free coupons that offered substantial savings. The obvious but instructive point here is that we expect discount coupons to do double duty. Not only do we expect them to save us money, we also expect them to save us the time and mental energy <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>required<\/u><\/span> to think about how to do it. In today&#x27;s world, we need the first advantage to handle pocketbook strain; but we need the second advantage to handle something potentially more <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>important<\/u><\/span> - brain strain."], "notes": [], "bogi": null, "ch": null, "ans": [3], "ex": {"core": [{"key": "❸", "fix": "were → did", "tag": "대동사 be vs do (as 뒤 도치)", "lines": ["Mailed out coupons (that - because of a printing error - offered no savings to recipients) produced just as much customer response as [were → did] error-free coupons (that offered substantial savings).", "→ 관계사절 묶으면 coupons(주어) + produced(동사) + response(목적어)가 남는다.", "→ as 뒤는 주어 error-free coupons와 동사가 자리를 바꾼 도치 구문. 대신할 동사는 <b>일반동사의 과거형<\/b> produced → <b>did<\/b>.", "as error-free coupons did → as did error-free coupons (도치)"], "ko": "인쇄 오류 때문에 아무런 할인도 제공하지 않은 우편 쿠폰이, 상당한 할인을 제공한 오류 없는 쿠폰만큼이나 많은 고객 반응을 이끌어 냈다."}], "others": [["❶", "them", "복수명사 operations를 가리킴 → them"], ["❷", "allows", "선행사 the discount coupon(단수) → allows"], ["❹", "required", "시간·에너지가 '요구되는' 것 → p.p."], ["❺", "important", "something은 형용사가 뒤에서 수식"]], "note": "※ as/than + 대동사 + 주어 도치: 앞 동사의 종류(be/일반)·시제와 도치된 주어의 수를 함께 확인한다.", "summary": ""}}, {"no": 24, "src": "6월 30번", "stem": "<b>다음 글의 밑줄 친 부분 중, 어법상 <u>어색한<\/u> 것은?<\/b>", "kind": "mark", "sym": "①", "n": 5, "p": ["Usually, innovative high-tech products have low price elasticity. This means <span class=\"opt\" data-k=\"1\"><span class=\"mk\">❶<\/span><u>that<\/u><\/span> high variation in price, an increase as well as a decrease, does not significantly modify demand. These high-tech products have <span class=\"opt\" data-k=\"2\"><span class=\"mk\">❷<\/span><u>few<\/u><\/span> substitutes, meaning that the costs to switch to another product are high. Additionally, at the first stage of the technology, buyers – either innovators or forerunners – are less sensitive to price than to additional performance; they often have deep pockets or are ready to spend a lot for a new innovative and outstanding product. For instance, with its new product range, a high-end mobile phone manufacturer is aiming at the 3% of millionaire households with assets of more than $2.5 million; those are customers <span class=\"opt\" data-k=\"3\"><span class=\"mk\">❸<\/span><u>who<\/u><\/span> are ready to accept the price range the manufacturer has set. At that stage, the competitors are not interested in <span class=\"opt\" data-k=\"4\"><span class=\"mk\">❹<\/span><u>lowering<\/u><\/span> their price significantly whatsoever, because they are chasing the same categories of customers, not sensitive to price. Furthermore, the high price of these products is often perceived as a sign of quality and <span class=\"opt\" data-k=\"5\"><span class=\"mk\">❺<\/span><u>reinforced<\/u><\/span> a customer&#x27;s confidence in the company."], "notes": ["*elasticity: 탄력성"], "bogi": null, "ch": null, "ans": [5], "ex": {"core": [{"key": "❺", "fix": "rein
